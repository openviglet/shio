## Shio test overrides — fresh in-memory H2 per run so tests don't inherit
## stale columns (e.g. NOT NULL tenant_id left behind by older schemas)
## from the dev file database at ./store/db/shioDB.
shio.multi-tenant=false

# DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true mirror the dev/prod
# datasource (application.properties): Hibernate runs globally_quoted_identifiers
# so it references columns quoted/case-preserved, while the SH22 @TenantId filter
# predicate is emitted UNQUOTED — on a default H2 that folds to upper-case and would
# miss the lower-case `tenant_id` column. The case-insensitive params make them match,
# exactly as the SH26 schema ITs and the running app already do.
spring.datasource.url=jdbc:h2:mem:shio-test;DB_CLOSE_DELAY=-1;MODE=LEGACY;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

## Liquibase off in tests — schema is built from entity metadata via
## ddl-auto=create-drop (a fresh in-memory H2 per run). Production applies the
## versioned changelogs in db/changelog; tests skip them to stay fast and to
## avoid double-building the schema on top of create-drop.
spring.liquibase.enabled=false

## ── Mirrored from application.properties: how a request is READ (SH158) ──────────
##
## Everything below this line is a *copy of production*, not a test override. It has
## to be repeated because this file *shadows* the main one on the test classpath
## rather than merging with it — which is precisely how the defect SH112 found
## survived four blocks: the write surfaces were only exercised by tests that
## construct the request record in Java, and the one harness that sends real JSON did
## not exist yet. Anything in the main file that changes how a request is *parsed and
## bound* has to be mirrored here, or every test in this repository validates a
## configuration production does not run.
##
## ShRequestReadingConfigLintTest fails the build when the two files disagree. Do not
## "tidy up" a key from this block — check that test first.

## An omitted optional flag is `false`, not a 400.
spring.jackson.deserialization.fail-on-null-for-primitives=false

## @JsonView: a property with no declared view is still bound.
spring.jackson.mapper.DEFAULT_VIEW_INCLUSION=true

## Upload limits — without these an SH38 upload test proves Spring's 1 MB default
## works, not that the subsystem does.
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
