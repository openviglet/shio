## Shio test overrides — fresh in-memory H2 per run so tests don't inherit
## stale columns (e.g. NOT NULL tenant_id left behind by older schemas)
## from the dev file database at ./store/db/shioDB.
shio.multi-tenant=false

# SH967 — the change stream's scheduled pump is off in every test context. A test drives
# ShEventStreamHub.pump() itself; a background pass every second would race the assertion it is
# measured by, and in the benchmark it would count its own queries into somebody else's number.
shio.events.enabled=false

# SH1257 — production reads the published catalogue and installs into store/blueprints by
# default. A test context does neither: a suite that depends on a Viglet host being reachable is
# a suite that goes red offline, and an install into the repository's own store/ outlives the
# run. A test that wants either turns it on itself, against a loopback server and a @TempDir.
shio.marketplace.enabled=false
shio.blueprint.path=

# DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true mirror the dev/prod
# datasource (application.properties): Hibernate runs globally_quoted_identifiers
# so it references columns quoted/case-preserved, while the SH22 @TenantId filter
# predicate is emitted UNQUOTED — on a default H2 that folds to upper-case and would
# miss the lower-case `tenant_id` column. The case-insensitive params make them match,
# exactly as the SH26 schema ITs and the running app already do.
spring.datasource.url=jdbc:h2:mem:shio-test;DB_CLOSE_DELAY=-1;MODE=LEGACY;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

## Liquibase off in tests — schema is built from entity metadata via
## ddl-auto=create-drop (a fresh in-memory H2 per run). Production applies the
## versioned changelogs in db/changelog; tests skip them to stay fast and to
## avoid double-building the schema on top of create-drop.
spring.liquibase.enabled=false

## ── Mirrored from application.properties: how a request is READ (SH158) ──────────
##
## Everything below this line is a *copy of production*, not a test override. It has
## to be repeated because this file *shadows* the main one on the test classpath
## rather than merging with it — which is precisely how the defect SH112 found
## survived four blocks: the write surfaces were only exercised by tests that
## construct the request record in Java, and the one harness that sends real JSON did
## not exist yet. Anything in the main file that changes how a request is *parsed and
## bound* has to be mirrored here, or every test in this repository validates a
## configuration production does not run.
##
## ShRequestReadingConfigLintTest fails the build when the two files disagree. Do not
## "tidy up" a key from this block — check that test first.

## An omitted optional flag is `false`, not a 400.
spring.jackson.deserialization.fail-on-null-for-primitives=false

## @JsonView: a property with no declared view is still bound.
spring.jackson.mapper.DEFAULT_VIEW_INCLUSION=true

## Upload limits — without these an SH38 upload test proves Spring's 1 MB default
## works, not that the subsystem does.
spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB

# SH347 — the Spring test context cache holds 32 by default, and SH315's isolated-datasource rule
# has produced 33 distinct context keys. Crossing that line does not merely cost time: an evicted
# context is rebuilt with ddl-auto=create-drop, which **recreates the schema mid-run** and wipes rows
# a later test in the shared datasource is asserting about. It surfaced as
# ShAgentDurableIncidentTest#theCapDropsTheOldest failing in the full suite and passing in isolation
# — an order-dependent failure with no defect behind it, which is the worst kind of red build
# (SH250's rule: a flake is worse than a break).
#
# Raised rather than worked around, because the alternative is to stop applying SH315 correctly. The
# number is the count of isolated contexts plus headroom; SH317 is the open task about what they cost.
# Raised 64 -> 68 by SH603, which spent the last slot on the second task shape (see
# ShContextCacheHeadroomTest's note). Crossing the ceiling is not merely slow: an evicted context is
# rebuilt with ddl-auto=create-drop, which recreates the schema mid-run and wipes rows a later test
# in the shared datasource is asserting about -- the symptom is a test that fails only in the full
# suite. Four rather than one, so the next task is not immediately at the wall again, and the gauge
# still reports every slot spent.
# Raised 68 -> 69 by SH967: ShEventStreamCostBenchmarkTest counts statements, which are cumulative
# on the SessionFactory, so it needs a datasource of its own (ShBenchmarkIsolationLintTest refuses
# two benchmarks on one database, and a shared context would count everybody's queries as its own).
# Raised 69 -> 71 by SH1022, which spent both of the slots it adds: a benchmark counting entity
# loads and a cross-surface test comparing two listings' address sets. Both are SH315's rule --
# a measurement or a set assertion on a shared context is a statement about suite order.
# Raised 71 -> 74 by SH1025, which spends one on ShConsoleListingBenchmarkTest -- four hundred
# folders and six hundred posts in one folder, then Hibernate's entity-load count over listing it,
# which on a shared context would include every neighbour's reads. The gauge keeps a MARGIN of two
# above the declared count, so 71 was NOT two spare as the line above read it: it was none, and
# the next isolated test of any kind was going to fail this. Three rather than one, for SH603's
# reason -- a ceiling set to today's count refuses the next addition instead of measuring it.
# Raised 74 -> 77 by SH1030, whose paging test writes real bytes into the file store and counts
# facets over the whole library -- on a shared context it would count every other test's
# uploads. Three rather than one again, for SH603's reason: a ceiling set to today's count
# refuses the next addition instead of measuring it.
# Raised 77 -> 80 by SH1035, whose rendition test points shio.file-source.path AND
# shio.asset-renditions.path at temp directories -- a shared context would write superseded copies
# into the repository's own store/, and the prune assertion needs keep=2 rather than the shipped 3.
# Three rather than one, for SH603's reason, and this time the previous raise had left ZERO spare:
# the headroom note said so, and the next addition would have been refused rather than measured.
# SH1129 spent one (ShCdaAvailableLocalesBenchmarkTest counts statements from cumulative
# statistics), and this moved 80 -> 81 with it so one slot is left for the next.
spring.test.context.cache.maxSize=82
