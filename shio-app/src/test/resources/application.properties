## Shio test overrides — fresh in-memory H2 per run so tests don't inherit
## stale columns (e.g. NOT NULL tenant_id left behind by older schemas)
## from the dev file database at ./store/db/turingDB.
shio.multi-tenant=false

spring.datasource.url=jdbc:h2:mem:shio-test;DB_CLOSE_DELAY=-1;MODE=LEGACY
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

## Flyway off — schema is built from entity metadata
spring.flyway.enabled=false
