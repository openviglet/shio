# Agent-surface token budgets (SH132; SH113 extends this file with response budgets).
#
# Every number here is an *estimated* token ceiling, using the same 4-chars-per-token
# heuristic the instance itself reports in `X-Shio-Est-Tokens` (ShTokenBudget). A build
# that breaches one has made the agent surface more expensive, and design law P3 says a
# token regression is a build failure, not a footnote.
#
# Raising a number is allowed — it is a deliberate, reviewable act. Raising one without
# saying why in the commit message is the thing this file exists to prevent.
#
# --- MCP tool schemas (SH132) ---
#
# These are the priciest fixed cost on the surface: `tools/list` is re-sent on every
# turn of every session, before any work happens, so the agent pays for it whether or
# not it writes anything. The 12-tool cap in ShMcpServerTest is a proxy for this number;
# this is the number itself.
# Measured 2026.3 with 8 tools: ~1655. Raised for Block K, which adds the two tools the
# whole block exists for: shio_verify (174) and shio_digest (146) — measured ~2010 with
# 10 tools. The trade is deliberate and it is the good direction: ~355 tokens per turn
# buys the agent the ability to check its own work, against a human round trip that costs
# orders of magnitude more. The ceiling keeps ~5% headroom so a typo fix does not fail the
# build, but an eleventh tool or a paragraph-length description will.
# Raised again for Block J (SH93): shio_apply gained `blueprint` + `params`, taking it from
# 365 to 437 and the list from ~2010 to ~2103. Still ten tools — the alternative was an
# eleventh (a shio_blueprint of its own), which would have cost more than the two arguments
# did and would have made "which tool" a decision the model has to get right.
# Raised again for SH143: shio_verify gained `folder` + `address` + `since`, taking it from
# 174 to 199 and the list to ~2177. This is the one raise on this file where the schema cost
# is *repaid inside the same feature*: the arguments exist so the tool can stop returning a
# whole-instance report after a three-page write, which is hundreds to thousands of response
# tokens saved per call, several times a session, against ~25 fixed. Two rounds of trimming
# went first (the description names each defect class once instead of describing it) — that
# is the order these raises should happen in.
# Raised for SH160: an eleventh tool, `shio_remember` (128 measured), taking the list from
# 2199 to 2327. This is the largest single raise on this file and the one with the weakest
# per-call payback, so the reasoning is here rather than only in the commit.
#
# SH114 argued *against* this tool and was right about Claude Code: a schema is paid on every
# turn, a coding agent has a terminal, and `shio remember` costs nothing per turn. It was
# wrong about a pure MCP client, which has no shell — it could read the memory (the notes ride
# in the context pack for free) and had no way to write one, so `instanceMemory: true` in the
# manifest was a half-truth for exactly the clients the manifest exists to inform.
#
# P1 (every capability lands on MCP first) beats P3 here because of *what* was missing. The
# memory is the only mechanism in the product that makes session N+1 cheaper than session N,
# and it is write-once-read-many: a store nobody can write to stays empty, so the free read
# returns nothing. The two cheaper shapes were considered and rejected — a `remember` property
# on shio_write costs a third as much and does not deliver the capability, because most
# conclusions worth keeping are reached while *reading* and there is no write to hang them on.
#
# The description was trimmed from 167 to 128 before this line moved, which is the order these
# raises should happen in. Note also that shio_apply now measures 457 against a 460 per-tool
# ceiling: it is the next thing to breach, and the answer there is trimming, not another raise.
# Raised 2360 -> 2375 by SH342, which added `when` to post.publish — scheduled publishing had no
# agent form at all, so `scheduledPublish: true` was a capability the manifest advertised and no call
# could reach (SH338's inventory named it). The trim came first, as agents.md requires: shio_apply
# went from 457 to 440 by dropping the sentence that explained *why* idempotence is useful, which
# funded 17 of the 23 tokens. Measured at the moment of the raise: total 2359/2360 — one token of
# headroom — so this ceiling had become a wall for any new argument anywhere, which is worth knowing
# before the next one is proposed.
mcp.tools.list.total=2375
# No single tool may dominate the list. A tool that needs more than this is usually two
# tools' worth of schema wearing one name, or a description restating its parameters.
# Measured 2026.3 after SH160: shio_apply 457, shio_write 359, everything else under 205.
# The ceiling was 400 through Block K and is 460 from Block J. shio_apply is the one tool
# that legitimately covers two verbs — "converge to this document" and "converge to this
# package" are the same decision with different inputs — and folding the second into an
# argument is what keeps the tool count at ten. It is now the tool to watch: another
# argument on it, rather than a new tool, is the next thing that will breach this.
mcp.tools.list.max-per-tool=460
# The handshake is paid once per session, but it is paid before the client knows whether
# the server is useful, so it stays small too.
# Measured 2026.3: ~169, almost all of it the `instructions` opening move.
mcp.initialize=200

# --- Canonical task benchmark (SH112) ---
#
# ShAgentTaskBenchmarkTest runs four canonical jobs twice each: once over the agent
# surface, once over the same instance's console/CDA endpoints the way a client without
# addressing, batching or a context pack would have to. Four numbers are guarded per task
# — the agent path's calls and tokens, and how much cheaper it is than the baseline on
# each. Ratios are integer *tenths* (25 = 2.5x) so they live in this file like every other
# number instead of in a second one.
#
# The call ceilings are exact: a call count is deterministic, and an extra round trip is a
# deliberate protocol change, not drift.
#
# The token ceilings are deliberately loose. Every agent path here opens with a full
# context read, whose model section describes the *instance* — so in a shared test run the
# number moves with however many post-types other classes created, and a tight ceiling
# would fail on test order rather than on a regression. Tight per-response guarding is
# SH113's job (see `response.*` below, which measures a fixed fixture); what these numbers
# catch is a task that got dramatically more expensive. The ratios are the robust half:
# both paths grow together, so a ratio floor holds whatever the instance contains.
#
# Measured 2026.3, Block O. EVERY TOKEN RATIO FELL AGAIN, AND AGAIN EVERY ONE OF THEM FELL
# BECAUSE THE BASELINE GOT BETTER. Read the next four paragraphs before touching a number here.
#   task                    agent calls/tokens   baseline calls/tokens   ratios (calls/tokens)
#   fix-broken-link              4 /   306            7 /  3717            1.7x / 12.1x
#   build-marketing-site         5 /  4459           14 /  9464            2.8x /  2.1x  (1.6x alone)
#   translate-site               4 /  1087            9 /  3724            2.2x /  3.4x
#   add-type-and-10-posts        4 /  2618           13 /  7609            3.2x /  2.9x
#
# Block M measured 3.8x-23.3x. Block N measures 2.6x-12.6x against an unchanged agent path,
# and the whole difference is two alignment tasks on the *baseline* side:
#
#   SH117 retired the id-keyed, entity-shaped `/api/v2/post/type` and pointed the console at
#   the same name-keyed, lossless `/api/v2/post-type` the CLI uses. Listing post-types
#   stopped shipping ids, widget objects, dates and owners: marketing-site 14928 -> 12236,
#   add-type 17707 -> 13298.
#
#   SH120 replaced the console listing's serialized `ShPostUnified`/`ShFolder` entities with
#   rows carrying the CDA's own field names. A folder listing stopped dragging each post's
#   attributes, folder, site and post-type field tree along with it: fix-broken-link's
#   baseline 7145 -> 3877 (-46%), translate-site 10033 -> 5539 (-45%).
#
# WHAT THAT MEANS FOR THE CLAIM, STATED PLAINLY. A large part of the agent surface's measured
# token advantage was never the protocol — it was the console reads being entity-shaped. Now
# that they are not, **tokens clear the spec's ~10x on one task of four** (fix-broken-link),
# down from three in Block M, and **tool calls clear ~6x nowhere: the best is 3.2x.** The
# advantage that remains is the real one and it is the one worth defending: addressing
# instead of id round trips, one batch instead of N writes, a context pack instead of a
# crawl, and a lint that names the defective post instead of a read-everything sweep. It is
# not payload leanness, because payload leanness is now on both sides. SH157 owns the call
# count and SH164 owns re-establishing the token claim on its actual sources.
#
#   SH176 (Block O) did the same thing to the *post* read, which is the one the baseline calls
#   most. `GET /post-unified/{id}` and every write response stopped serializing the entity —
#   so they stopped carrying the folder's and site's entity graphs and stopped escaping the
#   `data` column as a JSON string inside JSON — and started carrying the post-type's SH16
#   def, which is what the form actually needed. Leaner *and* more useful, which is why this
#   is the SH164 effect rather than a benchmark being optimized: nothing was removed that a
#   caller must now ask for twice. Baselines: fix-broken-link 3877 -> 3717,
#   build-marketing-site 11604 -> 9464, translate-site 5539 -> 3724 (-33%),
#   add-type-and-10-posts 13298 -> 7609 (-43%, it pays that read eleven times).
#
# The floors below therefore drop with the measurement rather than being defended. A ratio
# floor measures a *gap*; closing a gap by fixing the slow side is what P1 and P5 are for,
# and a floor that outran what the surface achieves is a floor somebody disables. Three
# blocks running, the honest summary is the same one: the measured advantage was partly the
# console being wasteful, and every time that is fixed the ratio the benchmark reports goes
# down while the product gets better. Tokens now clear the spec's ~10x on one task of four,
# and SH164 is the task for attributing what is left to the sources that actually produce it.
#
# Measured 2026.3, SH157. FOR THE FIRST TIME IN THREE BLOCKS, EVERY NUMBER MOVED BECAUSE THE
# AGENT PATH GOT BETTER RATHER THAN THE BASELINE GETTING LEANER.
#   task                    agent calls/tokens   baseline calls/tokens   ratios (calls/tokens)
#   fix-broken-link              3 /   364            7 /  3807            2.3x / 10.5x
#   build-marketing-site         4 /  2375           14 /  6633            3.5x /  2.8x
#   translate-site               3 /   660            9 /  3795            3.0x /  5.8x
#   add-type-and-10-posts        3 /  1616           13 /  6085            3.8x /  3.8x
#
# Every task lost a call, and the two SH157 changes are why. Discovery folded into one read
# (`/agent/context?include=all,manifest` carries the manifest's features, limits and
# startHere, so the manifest read that opened every session is gone), and proof folded into
# the write (`?verify=true` lints exactly the addresses the run touched, so the verify that
# closed every session is gone too). **Tool calls now clear 2.3x-3.8x against ~1.7x-3.2x
# before, and ~6x is still not met anywhere** — the remaining calls are real work, so the
# next one to remove is a harder argument than these two were.
#
# TOKENS MOVED TOO, IN BOTH DIRECTIONS, AND THE DETAIL IS THE INTERESTING PART.
# build-marketing-site nearly halved (4459 -> 2375) because the manifest read it dropped was
# the single most expensive call on the whole agent path — 2343 tokens to learn what ~350 of
# capabilities answers. Against that, fix-broken-link went 306 -> 364: the proof attached to
# its write genuinely costs more than the terse re-verify it replaced. That is the trade this
# task makes, stated plainly — a round trip for a few tokens — and it is only that small
# because two things were fixed while measuring it: a clean proof no longer explains that
# none of its zero findings were caused by the run, and `/agent/batch` finally has the
# `format=terse` every read on this surface has had since SH78. That last one was an
# oversight rather than a decision; ShAgentReadTerse has rendered change sets for MCP since
# SH83 and only the REST endpoints could not ask for it.
#
# The floors below rise with the measurement. That is the first time in this file that
# sentence has been written in that direction.
#
benchmark.fix-broken-link.calls=3
benchmark.fix-broken-link.tokens=400
# Raised from 15 (1.5x) by SH157: the fix and the re-verify are one call now.
benchmark.fix-broken-link.min-call-ratio=20
# Lowered from 150 (15.0x) in Block N: SH120 halved the baseline's folder listing, so the
# measured gap is 12.1x (12.6x before SH176 trimmed the post read too). Still the widest of the four, and still the task that best shows
# what the protocol is for — the lint names the broken post, so the baseline's read-
# everything sweep is the cost being avoided.
# Held at 10.0x. Measured 10.5x, down from 12.1x: the write's proof costs more than the
# separate terse verify it replaced, which is SH157 buying a round trip with tokens. Still
# the only one of the four that clears the concept spec's ~10x.
benchmark.fix-broken-link.min-token-ratio=100
benchmark.build-marketing-site.calls=4
benchmark.build-marketing-site.tokens=2700
benchmark.build-marketing-site.min-call-ratio=30
# Lowered from 30 (3.0x) in Block N and from 21 (2.1x) in Block O: SH117 made the baseline's
# post-type listing lean, SH120 its folder listing and SH176 its post read. The narrowest of
# the four, and understated: this baseline reuses eight post-types the blueprint also
# provisions. It is also the one task whose ratio moves with *test order* — both paths read
# the instance's post-types, so a full-suite run (many types, created by other classes)
# measures 2.1x and this class run alone measures 1.6x. The floor sits under the smaller of
# the two, because a budget that only holds when the whole suite ran is a budget that fails
# the first time somebody reruns one class.
# Raised from 15 (1.5x) by SH157 — measured 2.8x, up from 2.1x, because dropping the manifest
# read halved this path (4459 -> 2375). Kept well under the measurement because of the
# test-order variance described above, which this task has more of than any other.
benchmark.build-marketing-site.min-token-ratio=20
benchmark.translate-site.calls=3
benchmark.translate-site.tokens=800
benchmark.translate-site.min-call-ratio=26
# Lowered from 70 (7.0x) in Block N and from 40 (4.0x) in Block O: SH120's leaner listing took
# the baseline from 10033 to 5539, and SH176's leaner post read from 5539 to 3724, so the
# measured gap is 3.4x. This task reads a post per locale, so the post read dominates it.
# Raised from 30 (3.0x) by SH157 — measured 5.8x, up from 3.4x. The write response is terse
# now, which on a batch of N upserts is where the saving is.
benchmark.translate-site.min-token-ratio=45
benchmark.add-type-and-10-posts.calls=3
benchmark.add-type-and-10-posts.tokens=1800
benchmark.add-type-and-10-posts.min-call-ratio=36
# Lowered from 65 (6.5x) in Block N and from 42 (4.2x) in Block O — measured 2.9x. It moves the
# most on every alignment: it pays the baseline's post-type read twice (list, then create) and
# its post read eleven times (ten creates plus a verify), so SH176 alone took 13298 to 7609.
# Raised from 25 (2.5x) by SH157 — measured 3.8x, up from 2.9x, for the same reason as
# translate-site: ten upserts answered in the terse encoding.
benchmark.add-type-and-10-posts.min-token-ratio=30

# --- Canonical response budgets (SH113) ---
#
# ShAgentResponseBudgetTest measures each of these through X-Shio-Est-Tokens (SH124) on a
# fixed fixture — one site, one post-type, three posts — and fails the build when one
# grows past its ceiling. It is the cheap guard between SH112 benchmark runs: what it
# really defends against is not a bad commit but entropy, somebody adding a convenient
# field to a listing DTO until the payload is entity-shaped again.
#
# Measured 2026.3, Block M:
#   manifest 2169 · context.terse 108 · context.json 173 · context.agents-md 343
#   SH174 re-measured the manifest at 2343 (a feature flag and a longer purpose line);
#   its two projections are budgeted separately below.
#   find 70 · read 28 · verify 14 · blueprints 467 · changes 125 · memory 6 · type-row 14
#
# Ceilings carry ~20-30% headroom — enough that a reworded
# teaching error or a longer fixture name does not fail a build, nowhere near enough to
# absorb a new field on every row. Raising one is allowed and must be justified in the
# commit; that is the entire mechanism.
#
# The manifest is the largest single read and the only one paid unconditionally per
# session, so it is the one to watch. SH116 now makes a repeat read a 304, which reduces
# how often it is paid but not what it costs the first time.
# SH327 raised this 2500 -> 2530 to declare POST /render/post-types; **SH344 gave it back**. That task
# needed a row too, and the SH327 note said the next raise had to ask which of the seven /cda/** rows
# earned its place — so two were pruned (the folder listing and the breadcrumb, both fully superseded
# by the context pack's sitemap and /agent/find) and the document came out at 2474: below the original
# ceiling, with a capability *added*. A budget given back is worth as much as one defended.
response.manifest=2500
# SH174's two cheaper readings of the same document, budgeted separately on purpose: their
# entire justification is being a fraction of the line above, and a shared ceiling would let
# that fraction erode without failing anything.
#
# Measured 2026.3, SH174: manifest 2343 -> check 298 (7.9x), terse 2088 (1.1x).
#
# `manifest.check` is the capability read — `include=features,limits`, no endpoint index —
# and it is what an agent re-reading the manifest to confirm one boolean should be paying.
#
# The terse number is the interesting one, and it is deliberately recorded rather than
# quietly dropped: 11% is a poor showing for an encoding that saves a third to a half
# everywhere else on the surface, and the reason is that this document's weight is *prose*
# — a purpose sentence and a runnable example, twenty-nine times — which the terse form
# keeps verbatim on purpose, since an abbreviated example is a call the instance would
# reject. So the lever on the manifest is `include`, not the encoding. The encoding still
# ships, for a reason that is about the 400 next to it: SH174 makes an unknown `format=` a
# teaching error, and an agent that asks for terse uniformly across the surface must not be
# the one who pays for that. Implementing it is what makes refusing the typo safe.
response.manifest.terse=2300
response.manifest.check=380
response.context.terse=145
response.context.json=220
response.context.agents-md=430
#
# --- The conventions section (SH292) ---
#
# The first ceiling this section has ever had, and it exists because the three rows above do not
# cover it: they measure the pack with include=instance,sites,sitemap, so the one part of the pack
# that carries *sentences* was the one part nothing measured. Only a rendering instance pays this
# (the render lines are conditional on the model holding a render post-type, SH272's rule).
# Measured 2026.3: helpers 120 tokens, the SH292 model line 59, total 179 — so the render facts add
# ~49% rather than the "roughly double" §XVI.44 feared, and 15 of those tokens were removed by the
# measurement itself: the draft repeated the four block-helper names one line after listing them.
# Set at 195 (~9% headroom) so a reworded sentence does not fail the build and a new paragraph does.
response.context.conventions.render=195
# One post-type row, not the whole model section: the section grows with the instance, so
# a ceiling on it would fail on how many types happen to exist. The row is what a careless
# field addition moves, and it multiplies by the size of somebody's content model.
response.context.type-row=25
response.find.terse=110
response.read.terse=60
response.verify.terse=60
# Raised from 470 in Block N: SH119 makes the starter a blueprint, so the catalogue has a
# sixth first-party row (385 -> 467 measured). A row per package is the listing doing its
# job — this is the one response that is *supposed* to grow with the first-party set, and
# the guard on it is really the per-row cost. The `nextjs-starter` description was cut to
# the length of its neighbours' first (P3: lean the payload before moving the ceiling);
# what is left is the row itself, and the ceiling goes back to the ~20% headroom every
# other number here carries.
response.blueprints.terse=570
response.changes.terse=180
response.memory=40

# --- Per-source attribution (SH164, corrected and extended by SH239) ---
#
# ShAgentSourceAttributionTest isolates the ideas the task benchmark above measures together, one
# pair per idea, and asserts a floor on each. It exists because the task ratios moved three blocks
# running for reasons that had nothing to do with the agent path — SH117, SH120 and SH176 each made
# the *baseline* leaner — so a single ratio per task could no longer distinguish "the protocol is
# cheaper" from "the old console was fat". A floor per source can: it holds when the baseline
# improves, and it fails when *that idea* stops paying.
#
# THE FIRST NUMBERS THIS FILE CARRIED FOR SH164 WERE THEMSELVES ORDER-DEPENDENT, and SH239 is what
# found it. The batching pair wrote its five posts into the same folder the addressing and lint
# pairs measure, so whichever ran first changed the other's baseline: addressing measured 26.2x
# when batching had already run and 11.8x when it had not. Exactly the confound this class was
# written to remove, one level in. Batching now writes to its own folder, and every number below is
# independent of test order. The corrected figures are lower and they are the real ones.
#
# Measured 2026.3 (five posts in one folder, one broken link, own database, order-independent):
#   source        agent calls/tokens   baseline calls/tokens   ratios (calls/tokens)
#   addressing         1 /    56            2 /   664            2.0x /  11.8x
#   projection         1 /    37            1 /    56            1.0x /   1.5x
#   batching           1 /   296            5 /  1815            5.0x /   6.1x
#   discovery          1 /   653            4 /   783            4.0x /   1.2x
#   lint               1 /   106            5 /  1642            5.0x /  15.5x
#
# ...and the two that are claimed to scale, at 45 posts in their own site (SH239):
#   addressing@scale   1 /    57            2 /  3025            2.0x /  53.1x
#   lint@scale         1 /   107           45 / 14933           45.0x / 139.6x
#
# WHAT THE ATTRIBUTION SAYS, AND IT IS NOT WHAT THREE BLOCKS OF TASK RATIOS IMPLIED.
#
#   THE LINT CARRIES THE TOKEN CLAIM, AND IT IS THE ONLY SOURCE THAT SCALES WITHOUT BOUND.
#   15.5x at five posts, 139.6x at forty-five, 45.0x on calls against 5.0x — one call against one
#   read per candidate. This is the number to quote when the claim is about a real site, and the one
#   place the concept spec's ~10x understates rather than overstates.
#
#   ADDRESSING SCALES, SUBLINEARLY, AND THE REASON IS WORTH KNOWING. 11.8x -> 53.1x for 9x the
#   content, because the baseline is a listing *plus* an id-keyed post read and the read is the
#   larger, constant half — SH176 made it lean, and since SH165 the listing is paged, which caps the
#   growth at one page however large the folder is. The console's own improvements bounded the
#   baseline they are measured against, for the third time in this file.
#
#   BATCHING BUYS TURNS, NOT BYTES: 5.0x calls against 6.1x tokens, and the token half is framing —
#   five posts' fields are sent either way.
#
#   DISCOVERY IS A ROUND-TRIP CLAIM AND ESSENTIALLY NOTHING ELSE: 4.0x calls against 1.2x tokens.
#   The context pack describes the instance, so it is not much smaller than the four reads it
#   replaces; what it removes is the four turns, and its call ratio grows by one per folder in the
#   tree. P2 says "one call replaces a session" and means it literally.
#
#   PROJECTION IS THE SMALLEST SOURCE MEASURED (1.5x, no calls saved) and the easiest to point at.
#   Its baseline is the protocol itself, so it is the one number a wasteful console cannot inflate.
#
# THE ~10x TARGET, DECIDED RATHER THAN INHERITED (the second half of SH164). The concept spec's
# "roughly an order of magnitude cheaper per task" is retired as the headline claim and kept as a
# *per-source* one. First, an aggregate per-task ratio is not actionable: it mixes five independent
# savings, so it moves when any of them moves and names none of them — and it fell three times for
# a reason nobody would call a regression. Second, it is not even stable in the right direction:
# making the console leaner (P1, P5) *lowers* it, so a team defending the number would be a team
# arguing against fixing the baseline. What replaces it:
#
#   * per-source floors, below, each defended by its own measurement;
#   * on tokens, ~10x where it is real — the lint, which is 15x on a small site and 140x on a
#     modest one — and honest single digits where it is not (discovery, batching, projection);
#   * on calls, the claim is a *session*: a canonical task is 3-4 calls (SH157), which is one agent
#     session rather than three. That is what "~6x fewer tool calls" was always a proxy for, and
#     the task benchmark's call ceilings are where it is guarded.
#
# The floors sit just under the measurement, as everywhere else in this file. Raising one is allowed
# and must be justified in the commit; *lowering* one means a specific idea stopped paying, which is
# a design question and not a budget edit.
attribution.addressing.min-call-ratio=20
attribution.addressing.min-token-ratio=110
attribution.projection.min-call-ratio=10
attribution.projection.min-token-ratio=13
attribution.batching.min-call-ratio=50
attribution.batching.min-token-ratio=55
attribution.discovery.min-call-ratio=40
attribution.discovery.min-token-ratio=11
attribution.lint.min-call-ratio=50
attribution.lint.min-token-ratio=150
#
# The same two sources at nine times the content (SH239). The assertion that matters is not the
# floor but that these RISE against the pair above, which is what makes "it grows with the site" a
# measurement instead of a story (§XIV.4: characterize by execution).
attribution.addressing@scale.min-call-ratio=20
attribution.addressing@scale.min-token-ratio=500
attribution.lint@scale.min-call-ratio=400
attribution.lint@scale.min-token-ratio=1300
#
# SH264 — what a whole-site structural proof costs, in queries rather than milliseconds (a timing
# ceiling on a shared machine is a flake, and SH250's lesson is that a flake is worse than a break).
# Measured by ShRenderSweepBenchmarkTest, which prints all of these on every run.
#
# The MARGINAL page is the number that matters: the first render of a site pays for the layout, its
# regions and the theme, and every page after it should not. If the marginal number ever approaches
# the first-page one, nothing is being reused and a whole-site sweep is multiplying work per page.
render.digest.max-marginal-page-queries=30
# The whole `verify` pass over three sites (SH307): what that task suspects is a multiplication —
# every site's graph rebuilt once per unused template — so the ceiling is on the pass, not the row.
verify.multi-site.max-queries=900
# SH310 — the prose a report carries, in characters. SH298 and SH308 both lengthened a rule that
# fires once per template; this is where that shows up before a caller pays for it.
verify.multi-site.max-message-chars=6000
# SH311 — the same pages inside ONE read-only transaction, which is what a write's `?digest=true`
# proof does. Before the sweep cache this measured the same as the standalone number above; the gap
# between the two is the whole of that task.
render.sweep.max-per-page-queries=12
#
# SH312 — the same sweep over pages that are not the simplest page there is, measured by
# ShRenderHelperSweepBenchmarkTest. SH311's 6 is a FLOOR: it caches a resolution, which is per
# post-type and therefore shared, while a helper reads content the page itself chooses — its own
# folder, its own reference field — which no resolution cache can reach. These ceilings are what a
# page shape costs on top of that floor, so a helper getting more expensive per row is visible.
render.sweep.max-listing-page-queries=20
render.sweep.max-section-page-queries=20
#
# SH316 — the graph's own repeats, measured by ShTemplateGraphMemoBenchmarkTest on a site with 12
# bindings and 40 pages. The task proposed memoizing the assembled graph; the measurement said the
# assembly was already free of queries (it cost 1.13 ms of CPU) and that the queries were the site's
# ROWS, re-read per rule. Before -> after: impact 2 -> 0 per call, verify 95 -> 60, assembly
# 1129445 ns -> 9065 ns.
#
# A COLD assembly inside a read-only transaction: this is SH311's cache reaching the graph, and the
# only one of the three the memo cannot flatter — it answers before the assembly runs.
graph.assembly.max-first-queries=8
# `impactOf` per call, which an /agent/changes feed pays once per template entry. Zero: the page
# counts read rows the transaction has already read.
graph.impact.max-marginal-queries=0
# The whole `content` pass over ONE site, on a fixture whose dial is bindings rather than sites
# (SH314) — the shape that makes a per-binding site read visible where the multi-site ceiling
# above cannot.
verify.one-site.max-queries=70
#
# SH340 — first-attempt success as a number. ShAgentNaiveClientBenchmarkTest drives the MCP surface
# the way a NAIVE client drives it (the four wrong calls a real session sent, plus a sweep that adds
# one unrecognised key per read tool), and counts what became of each.
#
# The two are counted separately on purpose. A TEACHING error costs one round trip and the SH80 `fix`
# makes the retry land. A SILENT DROP costs a wrong outcome nobody notices — SH331's scope/site case
# reported success and wrote the note where no session working on that site will read it. Lowering
# either is what SH331 (one name per concept, synonyms accepted and reported) and SH332 (publish the
# op vocabulary) are for; raising one must be justified in the commit.
#
# Measured before SH331: 6 SILENT DROPS in 12 calls — shio_context, shio_find, shio_verify and
# shio_changes all accepted an unrecognised key and answered 200, so the scope/site case was not one
# slip but the default behaviour of the surface. After SH331 (one refusal where arguments are read,
# plus synonyms accepted and reported): **0 drops and 6/6 naive calls landing on the first attempt**.
#
# Both are therefore at zero, and both are regression guards rather than ceilings to lower. The
# sweep's own refusals are asserted per tool instead of counted here — a refusal there is the fix
# working, so a budget over them would reward removing the check.
naive.max-silent-drops=0
naive.max-failed-first-attempts=0
