# Agent-surface token budgets (SH132; SH113 extends this file with response budgets).
#
# Every number here is an *estimated* token ceiling, using the same 4-chars-per-token
# heuristic the instance itself reports in `X-Shio-Est-Tokens` (ShTokenBudget). A build
# that breaches one has made the agent surface more expensive, and design law P3 says a
# token regression is a build failure, not a footnote.
#
# Raising a number is allowed — it is a deliberate, reviewable act. Raising one without
# saying why in the commit message is the thing this file exists to prevent.
#
# --- MCP tool schemas (SH132) ---
#
# These are the priciest fixed cost on the surface: `tools/list` is re-sent on every
# turn of every session, before any work happens, so the agent pays for it whether or
# not it writes anything. The 12-tool cap in ShMcpServerTest is a proxy for this number;
# this is the number itself.
# Measured 2026.3 with 8 tools: ~1655. Raised for Block K, which adds the two tools the
# whole block exists for: shio_verify (174) and shio_digest (146) — measured ~2010 with
# 10 tools. The trade is deliberate and it is the good direction: ~355 tokens per turn
# buys the agent the ability to check its own work, against a human round trip that costs
# orders of magnitude more. The ceiling keeps ~5% headroom so a typo fix does not fail the
# build, but an eleventh tool or a paragraph-length description will.
# Raised again for Block J (SH93): shio_apply gained `blueprint` + `params`, taking it from
# 365 to 437 and the list from ~2010 to ~2103. Still ten tools — the alternative was an
# eleventh (a shio_blueprint of its own), which would have cost more than the two arguments
# did and would have made "which tool" a decision the model has to get right.
# Raised again for SH143: shio_verify gained `folder` + `address` + `since`, taking it from
# 174 to 199 and the list to ~2177. This is the one raise on this file where the schema cost
# is *repaid inside the same feature*: the arguments exist so the tool can stop returning a
# whole-instance report after a three-page write, which is hundreds to thousands of response
# tokens saved per call, several times a session, against ~25 fixed. Two rounds of trimming
# went first (the description names each defect class once instead of describing it) — that
# is the order these raises should happen in.
# Raised for SH160: an eleventh tool, `shio_remember` (128 measured), taking the list from
# 2199 to 2327. This is the largest single raise on this file and the one with the weakest
# per-call payback, so the reasoning is here rather than only in the commit.
#
# SH114 argued *against* this tool and was right about Claude Code: a schema is paid on every
# turn, a coding agent has a terminal, and `shio remember` costs nothing per turn. It was
# wrong about a pure MCP client, which has no shell — it could read the memory (the notes ride
# in the context pack for free) and had no way to write one, so `instanceMemory: true` in the
# manifest was a half-truth for exactly the clients the manifest exists to inform.
#
# P1 (every capability lands on MCP first) beats P3 here because of *what* was missing. The
# memory is the only mechanism in the product that makes session N+1 cheaper than session N,
# and it is write-once-read-many: a store nobody can write to stays empty, so the free read
# returns nothing. The two cheaper shapes were considered and rejected — a `remember` property
# on shio_write costs a third as much and does not deliver the capability, because most
# conclusions worth keeping are reached while *reading* and there is no write to hang them on.
#
# The description was trimmed from 167 to 128 before this line moved, which is the order these
# raises should happen in. Note also that shio_apply now measures 457 against a 460 per-tool
# ceiling: it is the next thing to breach, and the answer there is trimming, not another raise.
# Raised 2360 -> 2375 by SH342, which added `when` to post.publish — scheduled publishing had no
# agent form at all, so `scheduledPublish: true` was a capability the manifest advertised and no call
# could reach (SH338's inventory named it). The trim came first, as agents.md requires: shio_apply
# went from 457 to 440 by dropping the sentence that explained *why* idempotence is useful, which
# funded 17 of the 23 tokens. Measured at the moment of the raise: total 2359/2360 — one token of
# headroom — so this ceiling had become a wall for any new argument anywhere, which is worth knowing
# before the next one is proposed.
# Raised 2375 -> 2385 by SH619, which added `state` to shio_read. Same order again: shio_read went
# 186 -> 172 first, which funded 14 of the 22 tokens, and only the remaining 8 moved this line.
# What the trim dropped was wording ("Pass `fields` to fetch only what you are about to change" ->
# "Project with `fields`"); both things a model acts on — draft-preference, and that an unprojected
# rich-text body is the expensive case — still say why. What it bought is the only way to read the
# PUBLISHED row's fields: before it, "what will change when I publish this" could not be assembled
# from this surface at all, at any price, which is a worse P3 outcome than ten tokens a turn.
# Raised 2385 -> 2395 by SH222, measured at 2391. Two op NAMES joined `shio_write`'s vocabulary —
# `post.restore` and `folder.restore` — and the trim-first rule found nothing to trim: the op
# descriptions do not reach this payload, only the names do, so the six tokens are two enum values
# and there is no wording behind them. Shortening the descriptions was tried first and moved the
# figure by zero, which is the measurement that made the raise the honest answer rather than the
# easy one.
#
# What it buys: `post.delete` has always replied "to trash (restorable)" and the trash was reachable
# from no read, no tool and no command. Six tokens a turn against a protocol that promised an undo
# it could not perform.
# Raised 2395 -> 2400 by SH227, measured at 2397, and the trim came first as always — it just did
# not cover the whole bill this time. `verify` on shio_apply costs ~26 tokens of schema; three
# trims to that tool's description gave back 10 of them, and all three were the same defect the
# ceiling exists to find: description prose restating a parameter the model reads one line later
# ("Set `blueprint` to apply a ready-made section ... instead of declaring one", "dryRun=true shows
# the diff", "the post's identity in this document"). Each kept the fact and dropped the sentence.
# The remaining 5 are this raise, and they buy the closing turn of the write-then-check loop on the
# tool that wanted it most: a desired-state apply writes a whole section at once, while the batch
# that got `verify` in SH157 is the finer-grained one. shio_apply is 441 of its 460.
# Raised 2400 -> 2500 by SH678, measured at 2493, for a twelfth tool: `shio_marketplace` (96).
# The trim came first and this time it found nothing in the fat tools: `shio_apply` (441) and
# `shio_write` (427) were read line by line and both are already phrases, with two prior trims
# recorded in their own comments. What the trim did find was in the NEW tool — its first draft
# measured 111 and ended "Apply an installed package with shio_apply", which restates shio_apply's
# own `blueprint` parameter. That is the defect this ceiling exists to find, and dropping it paid
# 15 of the 93.
#
# What the 96 buys is the one thing a terminal cannot give a client that has no terminal:
# DISCOVERY. It is SH160's argument arriving a second time and it held then — a pure MCP client
# could read the memory and not write one; here it can apply a package and not find out one
# exists. The tool is deliberately READ-ONLY, which is also why it is this cheap: installing calls
# a service in process, and an API token reaches /mcp while being barred from
# /api/v2/marketplace, so an install verb here would hand a token what the URL layer denies it —
# "the agent path is not a privilege escalation", by name.
#
# Headroom is ~7 tokens, which is thin and worth knowing before the next argument anywhere: this
# ceiling is a wall again, exactly as it was at SH342. It is also the twelfth tool, and
# ShMcpServerTest fails past twelve — so the next capability on this surface is an argument, a
# trim, or a conversation about which tool leaves.
# SH811 raised this from 2500, and the paragraph above is why it is not a surprise: it said the
# next capability here would be "an argument, a trim, or a conversation about which tool
# leaves", and this took the first. Measured rather than assumed — the twelve tools summed to
# 2499 against 2500, so the list had ONE token of headroom and any addition needed this line
# moved. `include=editable` on shio_digest cost 24 (146 -> 170) after the description was cut
# to its decision; a thirteenth tool the size of that one measured 146, five times more, and
# ShMcpServerTest refuses a thirteenth anyway. 2560 rather than 2523 so the ceiling still
# MEASURES the next addition instead of refusing it — a budget at its wall is the failure
# SH743 named, and 37 is about two arguments at the ~20 SH795 measured.
# SH1073 raised it again, from 2560 to 2640, and the argument is P1 rather than growth for its own
# sake. Four op fields — `locale` and `translationOf` (SH348), `url` (SH467), `expect` (SH721) —
# shipped REST-first, and shio_write read them from SH952 on without declaring them, so no MCP client
# could discover them; ShAgentP1ConformanceTest was counting `locales` as reachable over MCP on the
# strength of two of them. `expect` also needed shio_read's `digest`, or it advertised a guard whose
# input MCP could not obtain. Measured: the five arguments cost about 99 tokens gross. Cutting
# shio_write's wording to its decisions paid about 54 of them (the verb list the enum already
# states, the `op` description the enum IS, and a clause from nearly every field); the list landed at
# 2600, and 2640 keeps two arguments of headroom for the reason SH811 gave. shio_write itself ended
# at 458 of 460 and is on ShMcpToolBudgetTest's AT_THE_WALL with that reason.
# SH977 raises this from 2640 to 2820, once, and divides the rise between the additions that were
# each going to ask for it alone. Four are designed and none had room: a state perspective and
# include=revisions on shio_read, a schedule predicate and query fields on shio_find, `when` and
# `cancel` on shio_publish — 60 est. tokens each, which is two parameters at the SH976 ladder's
# measured rate — against 40 free. Whichever landed first would have taken the room and the rest
# would have shipped as a resource or an op by accident rather than by the ladder. The rise is 180
# for those three plus SH811's two arguments of headroom.
#
# The ladder was applied before the ceiling was: anything expressible as a batch op costs about 3
# tokens and belongs in shio_write's enum, and these four are not — they are parameters of a read, a
# search and a publish. shio_write and shio_apply get no rise at all; both are AT_THE_WALL, and
# SH1073 already spent shio_write's last two tokens on locale and translationOf.
# SH989 spent one of SH811's two arguments of headroom, and not by accident: `fields` on shio_changes
# is REST's include=fields, and without it the one description of an approved run that survives the
# approve would be the only half of the change feed an MCP client could not ask for (P1). The ladder
# was applied first — it is a parameter of a read, not an op. The allocation measured 2805 after it:
# 15 left, less than one argument at SH795's rate, so the next one is SH811's conversation again.
# SH990 had that conversation and paid for itself instead: `state` on shio_find (inside its SH977
# reservation, 199 -> 215), shio_verify (199 -> 215) and shio_digest measured 2843, and trimming
# shio_digest's examples of a page shape — why a digest is useful, re-sent every turn to a caller
# that has already chosen it — plus cutting the three new descriptions to their values brought it
# to 2820 with shio_digest at 169, one under its size before it took the argument. **The list is
# at its wall**: the next argument on an unreserved tool is a trim or a raise, with the argument.
# SH993 raises it again, 2820 -> 2850, and the thing being bought is an op FAMILY rather than an
# argument: release.upsert, release.add and release.remove measured 13 tokens in `shio_write`'s enum,
# about four each, which is the ladder working exactly as SH977 described it — anything expressible as
# a batch op costs a name and not a schema. release.run and release.archive are the two the same family
# still owes, budgeted here at about nine more so the task that writes them is not the one that pays
# for all five. The allocation measured 2832 after the three.
# SH1022 raises it again, 2850 -> 2920, and the thing being bought is a VOCABULARY rather than an
# argument: subtree, locale, modifiedSince, modifiedBefore, author and modifier, on the one read an
# agent makes most. The ladder was applied first and does not offer its usual answer -- an op on
# shio_write is the cheap shape for a WRITE, and there is no op spelling of "which drafts did Ana
# change this week". The nine words already on the tool were trimmed first, which paid 32 of the
# 102 the six cost, and the allocation measured 2917 after it. The six are ~17 est. tokens each
# against SH976's ~30 rate, which is what a description cut to its value costs. **The list is at
# its wall again**: three left, less than one argument.
# SH1022's "three left" was true, so this raise was inevitable and the only question was what it
# buys. SH1032 raises it 2920 -> 2960 for TWO things that are not the same kind, which is why they
# are separated here rather than summed:
#   - `asset.meta` in `shio_write`'s enum: ~4 tokens, a name and no schema. That is the ladder
#     working exactly as SH977 described it, and it is the cheap half.
#   - `usage` on `shio_assets`: ~15, one boolean cut to its value. The ladder was applied first and
#     does not offer its answer here either — an op is the cheap shape for a WRITE, and "where is
#     this used" is a read. The alternative shapes are both worse: a thirteenth tool is what
#     ShMcpServerTest refuses, and leaving it on REST only is the P1 break SH1032 exists to close.
# The trim came first as always and paid 2: the flag's description went from naming posts to naming
# the question. The allocation measures 2939 after both, so 21 of the 40 is spent and the rest is
# deliberately NOT at the wall — SH1022 and SH990 both left three, and a ceiling with three left
# makes the next task's first act a budget conversation rather than its own work.
# SH1060: 2960 -> 2975, measured 2964 after the trims below paid 10 of the parameter's 30. What is
# bought is the coverage question on the surface an agent works from — "which pages have no pt-br"
# was a read of the whole site and a group-by in somebody's head, and it is now one predicate. The
# eleven left are deliberate and are the same reason SH1022 and SH990 left three: a ceiling at the
# measurement makes the next task's first act a budget conversation rather than its own work.
# SH1064 raises nothing and is recorded because the pool is what it spent: `post.redirect` measured
# 4 est. tokens inside `shio_write`'s enum (493 -> 497 against the 520 per-tool ceiling), and the
# allocation reads 2968 of 2975 — four of the eleven SH1060 left, which is exactly what they were
# left for. The ladder was applied and gave its usual answer: the capability is a WRITE, so it is a
# name rather than a schema, and the alternative shapes are both worse — a flag on post.move would
# have been a second way to write a Redirect post beside post.upsert type=Redirect, and a console
# button is the P1 break. Seven left, so the next addition here is a ceiling conversation.
# SH1086 raises nothing and paid for itself: `address` on shio_changes (SH1005's "what happened to
# this page") cost about 16, and trimming the tool's description and `since` text, both of which
# restated the cursor, paid 20. The allocation reads 2964 of 2975, four fewer than before it. The
# other three SH1005 narrowings (action, actor, subject) stay on REST and the CLI.
mcp.tools.list.total=2975
# --- SH977: how the room above is divided, before anybody spends it ---------------------------
#
# A reservation is the most that tool may cost, not the most it may grow by: a tool over its
# reservation fails the build, and a task adding an argument cites its reservation rather than the
# ceiling. Unreserved tools have no planned addition and are held at what they cost today, which is
# what makes the sum below an allocation rather than a wish. Raising one of these is the same kind
# of diff as raising the ceiling, and it has to say which planned capability is giving up its room.
# SH1003 releases both, the same move SH999 made on `shio_publish` and for the same reason: a
# reservation is for a PLANNED addition, and SH977 held these for SH990's `state` on the read and
# the find, and SH991's schedule predicate. All of them shipped. `shio_read` settled at 247 against
# 254 and `shio_find` at 255 against 259, so eleven tokens were being counted by the allocation and
# could be spent by nobody — the queue SH977 exists to stop. `note.add` and `note.resolve` measured
# 3 each inside `shio_write`'s enum, which is the ladder working exactly as SH977 describes it.
#
# **`shio_write` is now at 490, its own ceiling, with nothing left.** The next op on it is the
# conversation SH993 had about `max-per-tool`, not an argument anybody can slip in: its enum IS the
# write vocabulary, so a verb has nowhere else to be named.
mcp.tools.list.reserved.shio_read=247
# SH1022 raises this 255 -> 328, and names what gives up the room: nothing planned did, because
# SH1003 had already released this reservation's planned additions (SH990's state, SH991's
# schedule) and the 255 was what the tool settled at. So this is a re-reservation at today's
# measured size rather than a claim on somebody else's room -- the ceiling above is where the 70
# net tokens came from, with the argument written there. It is held rather than released because
# `sort`, `page` and `size` are the three words this tool refuses today, and the surface that
# serves them is the console listing: if the cursor ever stops being an address, they land here.
# SH1060 raises this 328 -> 343, and what gives up the room is that contingency: `sort`, `page` and
# `size` were the planned addition this reservation held, and `missingLocale` takes one word's worth
# of it. The ladder was applied first and does not offer its answer here — an op on `shio_write` is
# the cheap shape for a WRITE, and "which pages have no pt-br" is a read filter, so a parameter is
# the only shape it has. The trim came first, as always, and paid 10 of the 30: the tool's
# description had grown a clause restating the new parameter, which is what `max-per-tool` exists
# to catch, and five other descriptions lost a word each.
# SH1066 raises this 343 -> 352 for `submission`, and what gives up the room is the same
# contingency SH1060 drew on: `sort`, `page` and `size`, the words this tool refuses because its
# cursor is an address. The ladder gives no op here either — "which posts arrived through a form"
# is a read filter. The trim came first and paid 10 of the 19: the tool's description still listed
# seven of its own filters, the restating `max-per-tool` names, and `site` lost a word. The ceiling
# did not move: the list measures 2973 of 2975.
# SH1024 adds `agent` (what an agent run wrote) and pays for all of it by trimming: the list had 2
# tokens of room and the argument costs 17. Five descriptions lost what the name already says or what
# an example restated (`site`'s "omit for all", `q`'s field list, `type`'s and `locale`'s examples,
# `scheduled`'s wording). No reservation moved: shio_find measures 350 of 352, the list 2975 of 2975.
mcp.tools.list.reserved.shio_find=352
# SH999 takes `by` on shio_changes out of shio_publish's reservation rather than out of the ceiling,
# which is the first half of SH977's own rule: 216 was held for `when` and `cancel`, those shipped in
# SH992, and the tool settled at 197. A reservation whose planned capability has landed is nineteen
# tokens the allocation is still counting and nobody can spend, which is the queue SH977 exists to
# stop. So it is released rather than trimmed — shio_publish is held at today's size like every other
# tool with no planned addition, and if it needs room again the task that needs it reserves it and
# says what for. The argument measured 16 and the allocation reads 2847 of 2850 after it; the list
# is still at its wall, and the next one is SH811's conversation.
mcp.tools.list.reserved.shio_publish=197
# No single tool may dominate the list. A tool that needs more than this is usually two
# tools' worth of schema wearing one name, or a description restating its parameters.
# Measured 2026.3 after SH160: shio_apply 457, shio_write 359, everything else under 205.
# The ceiling was 400 through Block K and is 460 from Block J. shio_apply is the one tool
# that legitimately covers two verbs — "converge to this document" and "converge to this
# package" are the same decision with different inputs — and folding the second into an
# argument is what keeps the tool count at ten. It is now the tool to watch: another
# argument on it, rather than a new tool, is the next thing that will breach this.
# SH993: 460 -> 490. `shio_write` is the only tool this binds, and it is the conversation its
# AT_THE_WALL entry said the next addition would be: its enum IS the write vocabulary, so a release
# family that lands as ops has nowhere else to be named, and naming it anywhere else is the thirteenth
# tool ShMcpServerTest refuses. 471 measured with three release ops, ~480 with the five the family will
# have — so this is a ceiling the next addition is still measured against rather than refused by.
# SH1032: 490 -> 520, measured at 493, and it is the addition SH1003's note said would have this
# conversation rather than slip in. What crossed the line is ONE OP NAME in the enum — `asset.meta`,
# about four tokens — so the question this ceiling asks ("is this two tools wearing one name, or a
# description restating its parameters?") is answered no on both counts: `shio_write`'s prose has
# not grown since SH1073 trimmed it, and what grew is the vocabulary, which has a ceiling of its own
# that SH1032 raised with its own argument (ShAgentOpsReachTest, 950 -> 1000, measured 952).
# TWO CEILINGS ON ONE THING is the thing to notice here, and it is not duplication: the ops ceiling
# prices the vocabulary for a writer who asked for it, and this one prices the enum for every
# session whether it writes or not. They move together and they answer different questions, so the
# second must not be allowed to refuse what the first has already argued for — 520 is set so the
# next op is measured against it, and about seven more ops fit before it is the binding one again.
mcp.tools.list.max-per-tool=520
# The handshake is paid once per session, but it is paid before the client knows whether
# the server is useful, so it stays small too.
# Measured 2026.3: ~169, almost all of it the `instructions` opening move.
mcp.initialize=200
# SH976 — the two lists that had no ceiling, which is the wrong two to leave unmeasured: a resource
# is where work goes when the tool list is full, so the surface absorbing the pressure was the one
# nothing watched. Paid once, when a client lists them, rather than every turn — so the ceilings are
# looser than `mcp.tools.list.total` on purpose, and they exist to make growth visible rather than
# to ration it. The run prints both against these numbers on every build.
mcp.resources.list.total=900
mcp.prompts.list.total=900

# --- The CLI's discovery surface (SH394) ---
#
# The other half of the same question, and until now the half nobody measured. `tools/list` above
# is capped and checked on every build because it is re-sent every turn; `shio --help` was 14 KB of
# prose that no test, ceiling or benchmark touched. Neither number is derivable from the other, so
# the recurring argument that one surface is cheaper than the other was being made from intuition
# on both sides — which P3 calls a defect regardless of which way it points.
#
# THE TWO COSTS ARE SHAPED DIFFERENTLY AND THAT IS THE POINT. MCP's is per turn and bounded: every
# session pays `mcp.tools.list.total` on every turn whether or not it writes anything. The CLI's is
# per session, on demand, and unbounded: an agent pays for the help it actually reads, once, and
# nothing stops that text growing. A ceiling is the wrong instrument for the second shape on its
# own, which is why cli-help-budget.test.mjs PRINTS the per-session comparison and asserts only
# these three lines. It is a benchmark before it is a ceiling.
#
# Measured 2026.3, 31 help files: `shio --help` 1215, the largest command (`clone`) 1146, all 31
# together 9535. The task's own section quoted 14,363 bytes / ~3,600 tokens for `shio --help`; that
# figure predates SH208, which moved every command's text out of help.mjs into its own .txt, so it
# was measuring the source file rather than the output. Re-measured rather than inherited.
#
# What a caller actually reads to get from nothing to a correct first call is the global text plus
# one command's — around 1700 tokens, once. That is less than a single turn of `tools/list`, and it
# is printed rather than asserted because the comparison depends on how many turns a session runs,
# which is not this file's to declare.
cli.help.global=1300
# No single command may dominate the surface an agent pages through. A command needing more than
# this is usually two commands wearing one name — the same rule as max-per-tool, one surface over.
cli.help.max-per-command=1200
# Every command's help plus the global text: what reading the WHOLE CLI would cost. Nothing reads
# it all in one go, and that is exactly why it needs a ceiling — an unbounded total is how a
# per-command surface grows past the payload it was cheaper than.
# Raised 9800 -> 9900 by SH677, measured at 9857, for the 31st verb: `shio marketplace`, which is
# four sub-verbs (list/show/install/uninstall) and six flags. The trim came first as this file
# requires and it did most of the work — the first draft measured 9954, and dropping the three
# global flags it needlessly restated (--url/--user/--password, which no other command's help
# repeats) plus two wordy sentences gave back 97 of the 154. The remaining 57 are the command.
# What was NOT trimmed, deliberately: the sentence saying a catalogue must be enabled before
# anything is listed, and the one saying install is not apply. Those are the two mistakes a
# first-time caller actually makes, and cutting them to fit a ceiling would be optimizing the
# measurement by degrading the thing it measures — which is a non-goal by name.
#
# Raised 9900 -> 9950 by SH231, measured at 9950, for `push --adopt-memory` and the one line in
# `pull` that says the file it adopts exists. The trim came first and paid 40 of the 90: the
# `pull` prose went from three lines to one, since the pull's own report already names the file
# and the rule (P9), and `push`'s "that is what --force is for" sentence was restating a flag
# listed four rows below it.
#
# The other 50 are the honest part, and the number is the finding: this total was sitting at
# 9900 of 9900 — the gate had *no* headroom, so the next addition of any size was going to fail
# it whatever that addition was. Paying for one flag by cutting another command's documented
# behaviour would be exactly the degrade-the-measurement non-goal above, so the trim pass this
# calls for is SH736 (§XIII.26) rather than a side effect of a feature commit.
#
# Raised 9950 -> 10500 by SH1022, for the 39th verb: `shio find`. The trim came first and paid
# 34 of it -- the command's own help went from 304 to 270 by cutting each flag description to
# its value, which is the recurring waste this ceiling's message names. The rest is the verb,
# and it is the honest half: SH736 left this gate at 9551 against a 9552 wall, so the next
# command of ANY size was going to breach it, and the only way to pass by trimming would have
# been to delete another command's documented behaviour -- the degrade-the-measurement non-goal
# by name. Measured 9841 after. The raise is 550 rather than the 290 that would just clear the
# 4%, for SH603's reason: a ceiling set to today's total is a gate that refuses the next
# addition instead of measuring it, and this one has been at its wall twice already. What is
# left is about one command's help, and `shio.txt` and `clone.txt` are still where a trim pass
# should start (SH736, XIII.26).
#
# Raised 10500 -> 11000 by SH1040, for the 41st verb: `shio patterns`, three actions and one help
# text at 313 tokens with its line in `shio.txt`. No trim came first this time, and that is a
# decision rather than laziness: this message offers trimming and the paragraph above it names
# what trimming would have to be, which is deleting another command's documented behaviour --
# `clone.txt` is 461 tokens of flags a reader needs and `shio.txt` is the one text that is not
# optional. Freeing the 262 tokens the 4% wanted would have meant taking a documented flag off
# two or three commands to pay for a new one, which is the degrade-the-measurement non-goal by
# name. Measured 10342 after. The raise is 500 for a 313-token addition, so the headroom goes
# from 158 to 658 -- more than this gate has had since SH1022 -- which is SH603's point: the
# ceiling exists to make growth visible, and it can only do that while there is room under it.
#
# Raised 11000 -> 11500 by SH1086, for four flags on `shio changes` (--action, --actor, --subject,
