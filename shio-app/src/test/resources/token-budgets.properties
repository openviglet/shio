# Agent-surface token budgets (SH132; SH113 extends this file with response budgets).
#
# Every number here is an *estimated* token ceiling, using the same 4-chars-per-token
# heuristic the instance itself reports in `X-Shio-Est-Tokens` (ShTokenBudget). A build
# that breaches one has made the agent surface more expensive, and design law P3 says a
# token regression is a build failure, not a footnote.
#
# Raising a number is allowed — it is a deliberate, reviewable act. Raising one without
# saying why in the commit message is the thing this file exists to prevent.
#
# --- MCP tool schemas (SH132) ---
#
# These are the priciest fixed cost on the surface: `tools/list` is re-sent on every
# turn of every session, before any work happens, so the agent pays for it whether or
# not it writes anything. The 12-tool cap in ShMcpServerTest is a proxy for this number;
# this is the number itself.
# Measured 2026.3 with 8 tools: ~1655. Raised for Block K, which adds the two tools the
# whole block exists for: shio_verify (174) and shio_digest (146) — measured ~2010 with
# 10 tools. The trade is deliberate and it is the good direction: ~355 tokens per turn
# buys the agent the ability to check its own work, against a human round trip that costs
# orders of magnitude more. The ceiling keeps ~5% headroom so a typo fix does not fail the
# build, but an eleventh tool or a paragraph-length description will.
# Raised again for Block J (SH93): shio_apply gained `blueprint` + `params`, taking it from
# 365 to 437 and the list from ~2010 to ~2103. Still ten tools — the alternative was an
# eleventh (a shio_blueprint of its own), which would have cost more than the two arguments
# did and would have made "which tool" a decision the model has to get right.
mcp.tools.list.total=2160
# No single tool may dominate the list. A tool that needs more than this is usually two
# tools' worth of schema wearing one name, or a description restating its parameters.
# Measured 2026.3: shio_apply 437, shio_write 332, everything else under 205.
# The ceiling was 400 through Block K and is 460 from Block J. shio_apply is the one tool
# that legitimately covers two verbs — "converge to this document" and "converge to this
# package" are the same decision with different inputs — and folding the second into an
# argument is what keeps the tool count at ten. It is now the tool to watch: another
# argument on it, rather than a new tool, is the next thing that will breach this.
mcp.tools.list.max-per-tool=460
# The handshake is paid once per session, but it is paid before the client knows whether
# the server is useful, so it stays small too.
# Measured 2026.3: ~169, almost all of it the `instructions` opening move.
mcp.initialize=200

# --- Canonical task benchmark (SH112) ---
#
# ShAgentTaskBenchmarkTest runs four canonical jobs twice each: once over the agent
# surface, once over the same instance's console/CDA endpoints the way a client without
# addressing, batching or a context pack would have to. Four numbers are guarded per task
# — the agent path's calls and tokens, and how much cheaper it is than the baseline on
# each. Ratios are integer *tenths* (25 = 2.5x) so they live in this file like every other
# number instead of in a second one.
#
# The call ceilings are exact: a call count is deterministic, and an extra round trip is a
# deliberate protocol change, not drift.
#
# The token ceilings are deliberately loose. Every agent path here opens with a full
# context read, whose model section describes the *instance* — so in a shared test run the
# number moves with however many post-types other classes created, and a tight ceiling
# would fail on test order rather than on a regression. Tight per-response guarding is
# SH113's job (see `response.*` below, which measures a fixed fixture); what these numbers
# catch is a task that got dramatically more expensive. The ratios are the robust half:
# both paths grow together, so a ratio floor holds whatever the instance contains.
#
# Measured 2026.3, Block N (SH117 moved the baseline — see below):
#   task                    agent calls/tokens   baseline calls/tokens   ratios (calls/tokens)
#   fix-broken-link              4 /   306            7 /  7145            1.7x / 23.3x
#   build-marketing-site         5 /  4377           14 / 12236            2.8x /  2.7x
#   translate-site               4 /  1087            9 / 10033            2.2x /  9.2x
#   add-type-and-10-posts        4 /  2618           13 / 13298            3.2x /  5.0x
#
# THE TWO TOKEN RATIOS THAT FELL IN BLOCK N ARE THE BASELINE GETTING BETTER, NOT THE
# PROTOCOL GETTING WORSE — which is the case the assertion message calls out, and it is
# worth reading carefully because it is the only kind of "regression" here that is good
# news. SH117 retired the id-keyed, entity-shaped `/api/v2/post/type` and pointed the
# console at the same name-keyed, lossless `/api/v2/post-type` the CLI uses. Listing
# post-types stopped shipping ids, widget objects, dates and owners, so the two tasks that
# begin by learning the content model got much cheaper on the baseline side: marketing-site
# 14928 -> 12236 (-18%), add-type 17707 -> 13298 (-25%). The agent path did not change; its
# numbers above move only with how many post-types the shared test run happens to contain
# (the loose-ceiling caveat two paragraphs up).
#
# So the floors below drop with it. That is the honest bookkeeping: a ratio floor measures
# a *gap*, and closing the gap by fixing the slow side is the outcome P1 and P5 are for. It
# does mean the agent surface's headline advantage on model-heavy tasks is smaller than
# Block M reported, and the remaining gap on those two is now mostly batching rather than
# payload shape.
#
# READ THE TOKEN COLUMN AGAINST THE CLAIM, AND THE CALL COLUMN TOO. The concept spec's
# acceptance criteria are ~10x tokens and ~6x tool calls. **After Block N, tokens clear
# ~10x on two tasks of four** (fix-broken-link 23.3x, translate-site 9.2x) and miss on the
# two model-heavy ones — 2.7x and 5.0x, because the baseline they are measured against
# stopped being wasteful, not because the protocol got worse. It was three of four in Block
# M; the claim is narrower and the reason is a fix, which is the only kind of narrowing
# worth having. **Tool calls clear it nowhere: the best task is 3.2x against a 6x target.**
# That is the honest state of both claims, SH157 is the task for the call count, and SH164
# is the task for the two token ratios. The floors below are set at what the surface
# actually achieves, not at what the spec asked for, because a ceiling nothing can pass is
# a ceiling somebody disables.
benchmark.fix-broken-link.calls=4
benchmark.fix-broken-link.tokens=450
benchmark.fix-broken-link.min-call-ratio=15
benchmark.fix-broken-link.min-token-ratio=150
benchmark.build-marketing-site.calls=5
benchmark.build-marketing-site.tokens=6000
benchmark.build-marketing-site.min-call-ratio=25
# Lowered from 30 (3.0x) in Block N: SH117 made the baseline's post-type listing lean, so
# the measured gap is 2.7x. ~20% headroom, as everywhere else in this file.
benchmark.build-marketing-site.min-token-ratio=22
benchmark.translate-site.calls=4
benchmark.translate-site.tokens=1500
benchmark.translate-site.min-call-ratio=20
benchmark.translate-site.min-token-ratio=70
benchmark.add-type-and-10-posts.calls=4
benchmark.add-type-and-10-posts.tokens=3600
benchmark.add-type-and-10-posts.min-call-ratio=30
# Lowered from 65 (6.5x) in Block N for the same reason — measured 5.0x. This task pays the
# baseline's post-type read twice (list, then create), so it moved the most.
benchmark.add-type-and-10-posts.min-token-ratio=42

# --- Canonical response budgets (SH113) ---
#
# ShAgentResponseBudgetTest measures each of these through X-Shio-Est-Tokens (SH124) on a
# fixed fixture — one site, one post-type, three posts — and fails the build when one
# grows past its ceiling. It is the cheap guard between SH112 benchmark runs: what it
# really defends against is not a bad commit but entropy, somebody adding a convenient
# field to a listing DTO until the payload is entity-shaped again.
#
# Measured 2026.3, Block M:
#   manifest 2169 · context.terse 108 · context.json 173 · context.agents-md 343
#   find 70 · read 28 · verify 14 · blueprints 467 · changes 125 · memory 6 · type-row 14
#
# Ceilings carry ~20-30% headroom — enough that a reworded
# teaching error or a longer fixture name does not fail a build, nowhere near enough to
# absorb a new field on every row. Raising one is allowed and must be justified in the
# commit; that is the entire mechanism.
#
# The manifest is the largest single read and the only one paid unconditionally per
# session, so it is the one to watch. SH116 now makes a repeat read a 304, which reduces
# how often it is paid but not what it costs the first time.
response.manifest=2500
response.context.terse=145
response.context.json=220
response.context.agents-md=430
# One post-type row, not the whole model section: the section grows with the instance, so
# a ceiling on it would fail on how many types happen to exist. The row is what a careless
# field addition moves, and it multiplies by the size of somebody's content model.
response.context.type-row=25
response.find.terse=110
response.read.terse=60
response.verify.terse=60
# Raised from 470 in Block N: SH119 makes the starter a blueprint, so the catalogue has a
# sixth first-party row (385 -> 467 measured). A row per package is the listing doing its
# job — this is the one response that is *supposed* to grow with the first-party set, and
# the guard on it is really the per-row cost. The `nextjs-starter` description was cut to
# the length of its neighbours' first (P3: lean the payload before moving the ceiling);
# what is left is the row itself, and the ceiling goes back to the ~20% headroom every
# other number here carries.
response.blueprints.terse=570
response.changes.terse=180
response.memory=40
