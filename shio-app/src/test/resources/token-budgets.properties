benchmark.add-type-and-10-posts.min-token-ratio=30

# --- Canonical response budgets (SH113) ---
#
# ShAgentResponseBudgetTest measures each of these through X-Shio-Est-Tokens (SH124) on a
# fixed fixture — one site, one post-type, three posts — and fails the build when one
# grows past its ceiling. It is the cheap guard between SH112 benchmark runs: what it
# really defends against is not a bad commit but entropy, somebody adding a convenient
# field to a listing DTO until the payload is entity-shaped again.
#
# Measured 2026.3, Block M:
#   manifest 2169 · context.terse 108 · context.json 173 · context.agents-md 343
#   SH174 re-measured the manifest at 2343 (a feature flag and a longer purpose line);
#   its two projections are budgeted separately below.
#   find 70 · read 28 · verify 14 · blueprints 467 · changes 125 · memory 6 · type-row 14
#
# Ceilings carry ~20-30% headroom — enough that a reworded
# teaching error or a longer fixture name does not fail a build, nowhere near enough to
# absorb a new field on every row. Raising one is allowed and must be justified in the
# commit; that is the entire mechanism.
#
# The manifest is the largest single read and the only one paid unconditionally per
# session, so it is the one to watch. SH116 now makes a repeat read a 304, which reduces
# how often it is paid but not what it costs the first time.
# SH327 raised this 2500 -> 2530 to declare POST /render/post-types; **SH344 gave it back**. That task
# needed a row too, and the SH327 note said the next raise had to ask which of the seven /cda/** rows
# earned its place — so two were pruned (the folder listing and the breadcrumb, both fully superseded
# by the context pack's sitemap and /agent/find) and the document came out at 2474: below the original
# ceiling, with a capability *added*. A budget given back is worth as much as one defended.
#
# SH393 raises it 2500 -> 2650, measured 2520 with nine `elsewhere` pointers. The raise is on this
# line and *only* this line, which is the whole shape of the decision. What is bought: an MCP client
# can read that `exchange` is `shio import <file>` and `visualSnapshot` is `shio snapshot <page>`,
# rather than finding out by not finding a tool — the discovery that costs a failed call, a wrong
# conclusion ("this instance cannot do it") and sometimes a re-derivation of the whole MCP-or-CLI
# boundary, which six shipped tasks each did from memory.
#
# Two measurements changed the design before this number was written, and both belong here because
# the next person to add a map to this document will be tempted the same way. (1) Explaining each
# entry in prose cost 138 tokens instead of 81; the reason lives in ShAgentP1ConformanceTest, where
# it is reviewed, and the wire carries the command. (2) Riding `features` — which reads as the
# obvious home, since both are about capabilities — took `manifest.check` from 326 to 469, a **44%
# regression on the cheapest and most repeated read on the surface**, and this test is what caught
# it. `elsewhere` is its own `include=` section for that reason alone: nine pointers are noise
# beside a 2000-token endpoint index and a tax on a 330-token capability check.
#
# SH460 adds the build identity (`commit`, `builtAt`) to the identity scalars and RAISES NOTHING,
# which is the point of recording it here. Measured either side: manifest 2546 -> 2574, terse
# 2305 -> 2332, check 341 -> 361. Two fields on a document whose identity survives every
# projection cost ~20-28 tokens, and all three lines absorb it (76, 68 and 19 of headroom left).
#
# The check line is the one to watch, and 19 is deliberate rather than overlooked: a capability
# measured ~2.5 tokens on it at SH377, so this still catches the drift it exists for. Two fields
# were the whole design — a `startedAt` beside them was considered and dropped, because a JVM's
# start time only bounds the build from above and the timestamp already answers the question.
# SH809 raised this from 2650. `/agent/editable` is a new endpoint, so the index genuinely grew:
# a P1 exception that had been on the inventory for many blocks became a route, and the entry
# for it costs about 53 tokens after the description was cut to the decision it informs (the
# first draft was 90 over and P3 says lean the payload before moving the ceiling). Removing
# `universalEditor` from `elsewhere` gave a little back. 2820 rather than 2760 so the line
# keeps the 4% headroom SH743 requires — a ceiling at its wall refuses the next addition
# instead of measuring it, which is the failure that list exists to name.
# SH1035 raises it 2820 -> 2880, and the trim came first as this file requires. What is bought is a
# clause on the row that already describes the multipart surface: `{id}/replace swaps its bytes,
# keeping the id`. The first draft named the full path and measured 2713; cutting it to the shortest
# form that still names the route measured 2708, which is where the trimming ended -- there is no
# further wording to remove without dropping the route itself, and the route is the whole point.
#
# Why the clause has to exist at all: `replace` has been on REST since SH210 with one CLI caller,
# and the manifest is the ONLY place a client with no terminal learns the route is there. An agent
# that cannot find it does what the console used to do -- delete and re-upload -- which mints a new
# id and breaks every field pointing at the old one. That is P1 (a capability the agent path cannot
# reach is incomplete) against about five tokens.
#
# Why a clause and not a row of its own: a second endpoint row costs ~50 tokens on the most-read
# document on the surface, against ~5 here, and a caller who found the upload row has found both --
# it is the same multipart surface, refused as an MCP tool for the same base64 reason.
#
# 2880 rather than 2760, which is what clearing the 4% would have taken: 2708 of 2820 needed 113
# free and had 112, so the previous ceiling was failing this by ONE token. A ceiling that close is
# the SH743 failure it exists to name -- it refuses the next addition instead of measuring it -- and
# this is the third time this line has been at its wall (SH809's note said so, and SH230's before
# it). 172 free is about three more arguments at SH795's rate.
#
# SH1050 raises it 2880 -> 2920. `GET /console/summary` joins the index: counts, what is
# waiting for a person and the most recent trail rows, in one call. It is declared rather
# than classified console-only because that classification would have been false -- an agent
# arriving mid-project wants exactly this, and composing it from the review surface, the
# scheduled listing, the note list and the change feed is four calls for one question, which
# is P2 by name. 68 tokens for a read that replaces four is the trade this file exists to
# make visible; 144 free is the 4% the rule below asks for, with room for two more arguments.
response.manifest=2920
# SH174's two cheaper readings of the same document, budgeted separately on purpose: their
# entire justification is being a fraction of the line above, and a shared ceiling would let
# that fraction erode without failing anything.
#
# Measured 2026.3, SH174: manifest 2343 -> check 298 (7.9x), terse 2088 (1.1x).
#
# `manifest.check` is the capability read — `include=features,limits`, no endpoint index —
# and it is what an agent re-reading the manifest to confirm one boolean should be paying.
#
# The terse number is the interesting one, and it is deliberately recorded rather than
# quietly dropped: 11% is a poor showing for an encoding that saves a third to a half
# everywhere else on the surface, and the reason is that this document's weight is *prose*
# — a purpose sentence and a runnable example, twenty-nine times — which the terse form
# keeps verbatim on purpose, since an abbreviated example is a call the instance would
# reject. So the lever on the manifest is `include`, not the encoding. The encoding still
# ships, for a reason that is about the 400 next to it: SH174 makes an unknown `format=` a
# teaching error, and an agent that asks for terse uniformly across the surface must not be
# the one who pays for that. Implementing it is what makes refusing the typo safe.
#
# SH377/SH391 raise the terse line 2300 -> 2400, and the interesting part is not the raise.
#
# What the two tasks cost, measured either side of the change: manifest 2532 -> 2546, terse
# 2291 -> 2305, check 336 -> 341. That is **7 tokens per published capability** — a `features`
# boolean and an `elsewhere` pointer for `pageAudit` (`shio audit <page>`) and `siteCapture`
# (`shio clone <url>`) — and it is linear in capabilities, which is exactly the cost SH393 argued
# for and priced. Nothing about the shape got bigger.
#
# What the failure actually exposed: this line had **9 tokens of headroom**. SH174 measured terse
# at 2088 against 2300 and the comment below still describes that; it has since drifted to 2291
# with nobody noticing, because a ceiling is silent until it is crossed. Two capabilities that cost
# 14 tokens between them were never the regression — they were the first thing to arrive after the
# margin was gone.
#
# So the number to think about is the headroom, and for **this** document the 20-30% rule of thumb
# at the top of this file is wrong in a way worth writing down. The manifest carries 29 endpoint
# rows. The regression it exists to catch — "somebody adds a convenient field, every row grows by
# twelve tokens" — is therefore worth roughly 150 tokens here. 30% of 2300 is 690: a ceiling with
# that much slack would absorb four such regressions in silence, which is the guard defeated by its
# own rule of thumb. **Headroom is bounded above by the smallest regression the guard must catch**,
# not by a percentage of the payload. 2400 leaves ~95 — enough for a reworded purpose line or two
# more capabilities, comfortably less than a field on every row.
# SH601 turned `startHere` from five ordered lines into two facts plus a six-row branch, and paid
# for it by deleting three lines the routing now answers per intent. Measured after: manifest
# 2635/2650, terse 2399/2400 -- ONE token of headroom, so this ceiling is a wall for any new line
# anywhere in the manifest, which is worth knowing before the next one is proposed.
#
# The trim overshot first and SH598's reachability walk caught it: dropping the MCP line took the
# eleven tool names out of what a reader can reach from one call, because that line is the only
# place they are published. It came back shortened rather than restored -- the prose around the
# names carried no decision and the names are the whole point of it.
# Raised by SH678 -- terse 2400 -> 2410 (measured 2402), check 380 -> 390 (measured 385), for ONE
# feature key: `marketplace`. The line above called the old ceiling a wall with one token of
# headroom, and this is the next line arriving, exactly as predicted.
#
# There was no cheaper shape. `ShAgentCapabilityJoinTest` requires every MCP tool to be claimed by
# a feature or declared unclaimed with a reason, and "unclaimed" would have been the dishonest one:
# the marketplace is off by default, so whether this instance reads a catalogue is precisely the
# kind of instance fact `features` exists to report. The alternative was a tool nothing advertises,
# which is the half-truth SH160 fixed for `instanceMemory`.
#
# `response.manifest` itself is 2640/2650 and untouched -- ten tokens, so it is the wall now.
#
# SH230 lowered the terse ceiling from 2410 to 2050. Measured 2395 -> 1890: `format=terse` now cuts
# each endpoint's purpose to its lead sentence, which is 21% of the document, where the encoding had
# been worth 1.1x. The ceiling comes down WITH the saving, because a ceiling left where it was lets
# the win erode without failing anything -- the rule this file's own note two sections up states.
# 2050 is ~8% headroom, which is what the fixture-name drift at the top of this file asks for.
#
# Read the pair before this one, though: terse was at 2395 of 2410, fifteen tokens, and the JSON
# form is still 2640 of 2650. A budget at its ceiling does not measure the next addition, it
# refuses it -- the finding SH736 fixed for the CLI help, sitting here on two more keys.
#
# SH1050 raises it 2050 -> 2130, for the line above's reason and no other: terse carries the
# new endpoint's lead sentence, which is what terse is. The ratio it exists to hold is
# unchanged -- 2018 of 2776 is the same 73% it was at 1890 of 2708 -- and a ceiling that did
# not move with the document would have failed on a capability rather than on erosion.
response.manifest.terse=2130
# SH1002 raises it 390 -> 420, and the argument is that this payload has nothing to trim: it is
# `features` plus `limits`, so it grows by one boolean key per capability and shrinks only by
# removing a capability. `reviewVerdicts` measured 395. The rise is to the 4% headroom the room rule
# asks for rather than to the measurement — 395 of 420 leaves 25, about five more flags — because a
# ceiling raised to today's number is one the next addition has to raise again.
# SH1032 raises it 420 -> 450, and spends exactly the room SH1002 budgeted: "about five more flags"
# was the estimate, `assetMetadata` and `assetUsage` are two of them, and 405 is what they measured
# — a little over five each, against SH377's ~2.5, because a camel-cased compound tokenizes worse
# than a single word. There is nothing to trim here for the reason SH1002 gave: this payload IS
# `features` plus `limits`, so its only lever is removing a capability, and removing one to declare
# another is how a census stops being a census. 450 restores the 4% headroom rule rather than
# tracking the measurement, which is the same reason SH1002 wrote 420 and not 395.
response.manifest.check=450
response.context.terse=145
response.context.json=220
response.context.agents-md=430
#
# --- The conventions section (SH292) ---
#
# The first ceiling this section has ever had, and it exists because the three rows above do not
# cover it: they measure the pack with include=instance,sites,sitemap, so the one part of the pack
# that carries *sentences* was the one part nothing measured. Only a rendering instance pays this
# (the render lines are conditional on the model holding a render post-type, SH272's rule).
# Measured 2026.3: helpers 120 tokens, the SH292 model line 59, total 179 — so the render facts add
# ~49% rather than the "roughly double" §XVI.44 feared, and 15 of those tokens were removed by the
# measurement itself: the draft repeated the four block-helper names one line after listing them.
# Set at 195 (~9% headroom) so a reworded sentence does not fail the build and a new paragraph does.
response.context.conventions.render=195
# One post-type row, not the whole model section: the section grows with the instance, so
# a ceiling on it would fail on how many types happen to exist. The row is what a careless
# field addition moves, and it multiplies by the size of somebody's content model.
response.context.type-row=25
# SH1122 - one SITE row of the JSON pack, measured on a site that HAS been configured: `furl` and
# `description` set, which is the only case the two fields cost anything in. Adding them moved
# `response.context.json` by ZERO tokens, because the benchmark's own site has neither and the row is
# NON_NULL - a true answer that says nothing about the field, which is why this second number exists.
# On the JSON rendering and not the terse one: terse deliberately omits both (it is the cheap form of
# the call that replaces a session) and the tree reads JSON, so a guard over the terse row would be a
# guard over a row the change never touched. It multiplies by the number of sites on an instance, so
# it is the number to watch if this row grows again.
response.context.site-row=40
response.find.terse=110
# SH981 measured its own idea and changed it. The console link and the preview link cost 26 est.
# tokens together on a terse row — a read went 28 to 54, where §LXIV.9 estimated ten — and with them
# on every row the build-a-site benchmark came in 800 over its own ceiling, because that task writes
# sixty times and hands over once. So they are `include=links` (and `links` on shio_read) rather than
# a field every reader pays for, which is SH721's shape, and this ceiling stays where it was: a
# default read is the 28 it always was.
response.read.terse=60
# SH987 — the same read, asking for the page's history. Its own ceiling rather than room added to
# the line above, because the claim an opt-in makes is precisely that the default did not move: a
# shared ceiling would let `read.terse` drift into the space this option was given. The fixture's
# page has never been published, so this measures the cost of asking and finding nothing — which is
# the number that must stay near the default, and the one a regression would show first.
response.read.terse.revisions=90
response.verify.terse=60
# Raised from 470 in Block N: SH119 makes the starter a blueprint, so the catalogue has a
# sixth first-party row (385 -> 467 measured). A row per package is the listing doing its
# job — this is the one response that is *supposed* to grow with the first-party set, and
# the guard on it is really the per-row cost. The `nextjs-starter` description was cut to
# the length of its neighbours' first (P3: lean the payload before moving the ceiling);
# what is left is the row itself, and the ceiling goes back to the ~20% headroom every
# other number here carries.
response.blueprints.terse=570
response.changes.terse=180
# SH989 — the same feed with include=fields, on its own row for SH987's reason just above: an opt-in's
# claim is that the default did not move, and a shared ceiling would let `changes.terse` drift into
# the room this option was given. The fixture only creates, and a create records no names, so this
# measures the cost of asking and finding nothing — the number that must stay at the default's.
response.changes.terse.fields=180
response.memory=40
# SH1104 — /agent/editable, on no budget since SH809 shipped it, and its catalogue on its own row for
# SH987's reason: include=insertable scales with what a layout declares (every accepted type with the
# fields a properties panel draws), and a shared ceiling would let the plain read grow into the room
# the option was given. Measured on a page that renders through a layout whose <main> accepts two
# section types of three fields each: 22 plain, 192 with the catalogue. The fixture is bound to that
# layout on purpose, and `theEditableBudgetMeasuresAPageThatComposes` holds the binding: without it
# the read answers `source: content`, thirty tokens of envelope that pass any ceiling forever.
response.editable=24
response.editable.insertable=205

# --- Per-source attribution (SH164, corrected and extended by SH239) ---
#
# ShAgentSourceAttributionTest isolates the ideas the task benchmark above measures together, one
# pair per idea, and asserts a floor on each. It exists because the task ratios moved three blocks
# running for reasons that had nothing to do with the agent path — SH117, SH120 and SH176 each made
# the *baseline* leaner — so a single ratio per task could no longer distinguish "the protocol is
# cheaper" from "the old console was fat". A floor per source can: it holds when the baseline
# improves, and it fails when *that idea* stops paying.
#
# THE FIRST NUMBERS THIS FILE CARRIED FOR SH164 WERE THEMSELVES ORDER-DEPENDENT, and SH239 is what
# found it. The batching pair wrote its five posts into the same folder the addressing and lint
# pairs measure, so whichever ran first changed the other's baseline: addressing measured 26.2x
# when batching had already run and 11.8x when it had not. Exactly the confound this class was
# written to remove, one level in. Batching now writes to its own folder, and every number below is
# independent of test order. The corrected figures are lower and they are the real ones.
#
# Measured 2026.3 (five posts in one folder, one broken link, own database, order-independent):
#   source        agent calls/tokens   baseline calls/tokens   ratios (calls/tokens)
#   addressing         1 /    56            2 /   664            2.0x /  11.8x
#   projection         1 /    37            1 /    56            1.0x /   1.5x
#   batching           1 /   296            5 /  1815            5.0x /   6.1x
#   discovery          1 /   653            4 /   783            4.0x /   1.2x
#   lint               1 /   106            5 /  1642            5.0x /  15.5x
#
# ...and the two that are claimed to scale, at 45 posts in their own site (SH239):
#   addressing@scale   1 /    62            2 /  3025            2.0x /  48.7x   (57/53.1x pre-SH545)
#   lint@scale         1 /   107           45 / 14933           45.0x / 139.6x
#
# WHAT THE ATTRIBUTION SAYS, AND IT IS NOT WHAT THREE BLOCKS OF TASK RATIOS IMPLIED.
#
#   THE LINT CARRIES THE TOKEN CLAIM, AND IT IS THE ONLY SOURCE THAT SCALES WITHOUT BOUND.
#   15.5x at five posts, 139.6x at forty-five, 45.0x on calls against 5.0x — one call against one
#   read per candidate. This is the number to quote when the claim is about a real site, and the one
#   place the concept spec's ~10x understates rather than overstates.
#
#   ADDRESSING SCALES, SUBLINEARLY, AND THE REASON IS WORTH KNOWING. 11.8x -> 53.1x for 9x the
#   content, because the baseline is a listing *plus* an id-keyed post read and the read is the
#   larger, constant half — SH176 made it lean, and since SH165 the listing is paged, which caps the
#   growth at one page however large the folder is. The console's own improvements bounded the
#   baseline they are measured against, for the third time in this file.
#
#   BATCHING BUYS TURNS, NOT BYTES: 5.0x calls against 6.1x tokens, and the token half is framing —
#   five posts' fields are sent either way.
#
#   DISCOVERY IS A ROUND-TRIP CLAIM AND ESSENTIALLY NOTHING ELSE: 4.0x calls against 1.2x tokens.
#   The context pack describes the instance, so it is not much smaller than the four reads it
#   replaces; what it removes is the four turns, and its call ratio grows by one per folder in the
#   tree. P2 says "one call replaces a session" and means it literally.
#
#   PROJECTION IS THE SMALLEST SOURCE MEASURED (1.5x, no calls saved) and the easiest to point at.
#   Its baseline is the protocol itself, so it is the one number a wasteful console cannot inflate.
#
# THE ~10x TARGET, DECIDED RATHER THAN INHERITED (the second half of SH164). The concept spec's
# "roughly an order of magnitude cheaper per task" is retired as the headline claim and kept as a
# *per-source* one. First, an aggregate per-task ratio is not actionable: it mixes five independent
# savings, so it moves when any of them moves and names none of them — and it fell three times for
# a reason nobody would call a regression. Second, it is not even stable in the right direction:
# making the console leaner (P1, P5) *lowers* it, so a team defending the number would be a team
# arguing against fixing the baseline. What replaces it:
#
#   * per-source floors, below, each defended by its own measurement;
#   * on tokens, ~10x where it is real — the lint, which is 15x on a small site and 140x on a
#     modest one — and honest single digits where it is not (discovery, batching, projection);
#   * on calls, the claim is a *session*: a canonical task is 3-4 calls (SH157), which is one agent
#     session rather than three. That is what "~6x fewer tool calls" was always a proxy for, and
#     the task benchmark's call ceilings are where it is guarded.
#
# The floors sit just under the measurement, as everywhere else in this file. Raising one is allowed
# and must be justified in the commit; *lowering* one means a specific idea stopped paying, which is
# a design question and not a budget edit.
attribution.addressing.min-call-ratio=20
attribution.addressing.min-token-ratio=110
attribution.projection.min-call-ratio=10
attribution.projection.min-token-ratio=13
attribution.batching.min-call-ratio=50
attribution.batching.min-token-ratio=55
attribution.discovery.min-call-ratio=40
attribution.discovery.min-token-ratio=11
attribution.lint.min-call-ratio=50
attribution.lint.min-token-ratio=150
#
# The same two sources at nine times the content (SH239). The assertion that matters is not the
# floor but that these RISE against the pair above, which is what makes "it grows with the site" a
# measurement instead of a story (§XIV.4: characterize by execution).
#
# 500 -> 480 (SH545), AND THIS IS THE ONE LOWERING IN THIS FILE THAT IS NOT AN IDEA STOPPING TO PAY.
# The measured ratio fell 53.1x -> 48.7x when `/agent/read` began reporting whether a post is
# published: five tokens on a fifty-seven-token document. The rule above says a lowering means a
# specific idea stopped paying and is a design question — so here is the design answer. The baseline
# this pair is measured against is `GET /api/v2/post-unified/{id}`, which has always returned
# `published` and `publicationDate`. So 53.1x was partly the agent read being cheaper by *omitting a
# fact the console response carried* — an agent that had to know whether a page was live paid for
# that in a second call to the public route, which this benchmark never counted. The comparison is
# now like-for-like and the number is lower for that reason. Addressing still pays 48.7x.
attribution.addressing@scale.min-call-ratio=20
attribution.addressing@scale.min-token-ratio=480
attribution.lint@scale.min-call-ratio=400
attribution.lint@scale.min-token-ratio=1300
#
# SH264 — what a whole-site structural proof costs, in queries rather than milliseconds (a timing
# ceiling on a shared machine is a flake, and SH250's lesson is that a flake is worse than a break).
# Measured by ShRenderSweepBenchmarkTest, which prints all of these on every run.
#
# The MARGINAL page is the number that matters: the first render of a site pays for the layout, its
# regions and the theme, and every page after it should not. If the marginal number ever approaches
# the first-page one, nothing is being reused and a whole-site sweep is multiplying work per page.
render.digest.max-marginal-page-queries=30
# SH967 — the change stream, measured by ShEventStreamCostBenchmarkTest before anything relies on it.
# The pump reads the feed once per open stream per pass, so an IDLE stream costs a fixed number of
# statements every shio.events.poll-millis for as long as a tab is open: measured 4 per pass (the
# feed page and its incident range, each with its count). A FAN-OUT costs each entry each stream:
# measured 7.05 per entry per stream for a reader who is not an administrator — an address lookup,
# and the content ACL's principals and folder chain walked again for every entry, which is most of
# it. A hundred writes to fifty open screens is 35,250 statements in one pass. Both ceilings are the
# measurement, so the next change that makes a pass dearer fails here with the number beside it.
# SH1077 — the ACL's inputs are memoized per pass and per tenant (the chain, each level's rows, each
# user's principals), so they are read once rather than once per stream: measured 10,552 statements,
# 2.11 per entry per stream, from 7.05. What remains is the feed page each stream reads for itself.
events.idle.max-statements-per-stream-pass=4
events.fanout.max-statements-per-entry-per-stream=3
# The whole `verify` pass over three sites (SH307): what that task suspects is a multiplication —
# every site's graph rebuilt once per unused template — so the ceiling is on the pass, not the row.
verify.multi-site.max-queries=900
# SH310 — the prose a report carries, in characters. SH298 and SH308 both lengthened a rule that
# fires once per template; this is where that shows up before a caller pays for it.
verify.multi-site.max-message-chars=6000
# SH311 — the same pages inside ONE read-only transaction, which is what a write's `?digest=true`
# proof does. Before the sweep cache this measured the same as the standalone number above; the gap
# between the two is the whole of that task.
render.sweep.max-per-page-queries=12
#
# SH312 — the same sweep over pages that are not the simplest page there is, measured by
# ShRenderHelperSweepBenchmarkTest. SH311's 6 is a FLOOR: it caches a resolution, which is per
# post-type and therefore shared, while a helper reads content the page itself chooses — its own
# folder, its own reference field — which no resolution cache can reach. These ceilings are what a
# page shape costs on top of that floor, so a helper getting more expensive per row is visible.
render.sweep.max-listing-page-queries=20
render.sweep.max-section-page-queries=20
#
# SH316 — the graph's own repeats, measured by ShTemplateGraphMemoBenchmarkTest on a site with 12
# bindings and 40 pages. The task proposed memoizing the assembled graph; the measurement said the
# assembly was already free of queries (it cost 1.13 ms of CPU) and that the queries were the site's
# ROWS, re-read per rule. Before -> after: impact 2 -> 0 per call, verify 95 -> 60, assembly
# 1129445 ns -> 9065 ns.
#
# A COLD assembly inside a read-only transaction: this is SH311's cache reaching the graph, and the
# only one of the three the memo cannot flatter — it answers before the assembly runs.
graph.assembly.max-first-queries=8
# `impactOf` per call, which an /agent/changes feed pays once per template entry. Zero: the page
# counts read rows the transaction has already read.
graph.impact.max-marginal-queries=0
# The whole `content` pass over ONE site, on a fixture whose dial is bindings rather than sites
# (SH314) — the shape that makes a per-binding site read visible where the multi-site ceiling
# above cannot.
verify.one-site.max-queries=70
#
# SH340 — first-attempt success as a number. ShAgentNaiveClientBenchmarkTest drives the MCP surface
# the way a NAIVE client drives it (the four wrong calls a real session sent, plus a sweep that adds
# one unrecognised key per read tool), and counts what became of each.
#
# The two are counted separately on purpose. A TEACHING error costs one round trip and the SH80 `fix`
# makes the retry land. A SILENT DROP costs a wrong outcome nobody notices — SH331's scope/site case
# reported success and wrote the note where no session working on that site will read it. Lowering
# either is what SH331 (one name per concept, synonyms accepted and reported) and SH332 (publish the
# op vocabulary) are for; raising one must be justified in the commit.
#
# Measured before SH331: 6 SILENT DROPS in 12 calls — shio_context, shio_find, shio_verify and
# shio_changes all accepted an unrecognised key and answered 200, so the scope/site case was not one
# slip but the default behaviour of the surface. After SH331 (one refusal where arguments are read,
# plus synonyms accepted and reported): **0 drops and 6/6 naive calls landing on the first attempt**.
#
# Both are therefore at zero, and both are regression guards rather than ceilings to lower. The
# sweep's own refusals are asserted per tool instead of counted here — a refusal there is the fix
# working, so a budget over them would reward removing the check.
naive.max-silent-drops=0
naive.max-failed-first-attempts=0
#
# SH384 — what a listing costs in ROWS, measured by ShRenderListingPageBenchmarkTest. The sweep
# ceilings above count prepared statements and are blind to this: the rows a listing MATERIALIZES are
# not the rows it draws. The ceiling is on the RATIO of rows loaded to rows rendered, not on the
# count, so enlarging the fixture cannot absorb the finding.
#
# SH419 paid it. It was 25 (measured 21: 213 rows loaded to render 10, identical for page 1 and page
# 19, because `findByShFolderAndStateIn` read the whole folder and `limit` was an in-memory window
# over it). The listing now folds, filters and sorts SORT KEYS and loads only the ≤limit posts it
# will draw, so the entity count stops growing with the folder — measured 2.
#
# 4 and not 2, because the measurement carries the page frame as well as the listing and how much of
# that frame is already resolved depends on which test in the class ran first; the same variance the
# benchmark's own `isLessThan` assertions are written around. What the ceiling has to catch is a
# return to loading the folder, which at a 200-post fixture is 21 and not 3.
render.listing.max-rows-loaded-per-row-rendered=4
#
# SH634 — and the cost the line above is structurally blind to. `getEntityLoadCount()` counts
# entities, a projection is not one, so the sort-key scan SH419 introduced is invisible to the very
# instrument that proved SH419. This counts rows every query in the session RETURNED, which sees it.
# It was 22 (228 rows returned to render 10, identical for page 1 and page 19). SH634 pushed the
# window into the query -- fold, type filter, order and offset -- and measured 3. The ceiling is 6,
# not 3, for the reason the entity ceiling is 4 and not 2: the number carries the page frame as well
# as the listing. What it has to catch is a return to scanning the folder, which at a 200-post
# fixture is 22 and not 5.
render.listing.max-rows-scanned-per-row-rendered=6
#
# --- What "where is this used" costs (SH1033) ---
#
# ShAssetUsageBenchmarkTest, and it needed a THIRD instrument rather than either of the two above.
# The entity counter measures rows a query returns; SH634's row counter measures the same thing one
# layer down. A query that reads fifty thousand rows to return three is invisible to both, and that
# is exactly the predicate here: `data like concat('%', :fileId, '%')` has a LEADING wildcard, so no
# B-tree orders it and the plan is a table scan whatever the answer is. The scan is read off H2's
# own EXPLAIN ANALYZE, whose scanCount is deterministic in the way SH264 requires and is the
# quantity in question.
#
# Measured 2026.3 at 1,000 / 10,000 / 50,000 posts, one asset with three referrers throughout. The
# run prints the table; what is recorded here is the shape, because the shape is what settles BE6.
#
# THE READ IS LINEAR IN THE TABLE AND IS PAID TWICE. `listUsage` loops PUBLISHED then DRAFT and runs
# the same predicate for each, so one detail dialog examines every post row in the tenant twice to
# answer with three. That makes it a per-INSTANCE cost wearing a per-asset interface, and the
# inverse question — which assets nothing references — is that cost once per asset.
#
# THE MAINTENANCE IS NOT LINEAR IN ANYTHING THE TABLE CONTROLS. The prototype — the table, its two
# indexes, and the walk that reads a post's own declared File and Content Select fields — costs one
# delete plus one insert per reference, measured identical at 50,000 rows and at zero, and turns the
# read into a seek bounded by the referrer count. TWO CURVES, NOT TWO NUMBERS: that is the finding,
# and it is why BE6 is not retired.
#
# Measured on H2 (1,000 / 10,000 / 50,000 rows), and the run prints the table:
#   rows examined per scan   1,002  ->  10,002  ->  50,002   (2 scans per dialog at every size)
#   maintenance per write        3  ->       3  ->       3   statements
#   through the prototype index: 4 rows examined at 50,000
#
# --- and what only a real engine could say (SH1033, the cross-database half) ---
#
# §LXX.5 asked for the number on EACH supported database, and the two ITs beside the benchmark
# (ShPostgresAssetUsageScanIT, ShMariaDbAssetUsageScanIT) found that the claim is not one fact.
#
# MARIADB agrees with H2: `type = ALL`, `key = null`, 5,001 rows read, and the answer is correct.
# `possible_keys` says PRIMARY, which is the key considered for `id <> ?` and declined; nothing was
# ever available for the substring. B-trees do not order substrings and FULLTEXT matches words, so
# a hyphenated UUID is neither the value stored nor a term that identifies one asset. This engine
# has the scan or a reverse-reference table, with nothing in between.
#
# POSTGRESQL DISAGREES TWICE, AND ONE OF THEM IS NOT A COST AT ALL.
#   * It CAN index a substring. `pg_trgm` turns `like '%<id>%'` into a bitmap index scan — proven
#     with `enable_seqscan = off`, because at 5,003 narrow rows the planner declines it on cost
#     (194 against 221). So §LXX.6 has a branch here the other two do not. Measured, and NOT
#     recommended: a GIN index over every document is maintained on every write, and choosing it
#     would put the cheapest path on one engine of three.
#   * The query returns NOTHING on this engine, at any size. `data` is `@Lob String`, which pgjdbc
#     stores as a large object: the column holds an OID, the document lives in `pg_largeobject`,
#     and Hibernate resolves it on read so the application looks correct. 5,001 rows, 5,001 large
#     objects, zero rows whose `data` is readable as text. That is **SH1099**, and it is wider than
#     this dialog — `FULLTEXT_PREDICATE` reads the same column, so console and CDA search find
#     nothing in a page's body. The ITs hold today's behaviour as assertions that fail when SH1099
#     lands, which is how that loop closes from this end.
# SH1034 lowered this from 2 to 0, which is the direction this file's own rule asks for: SH1033's
# assertion said the ceiling would come down WITH the fix rather than be left where a win can erode
# under it. `listUsage` reads `sh_object_reference`, so the substring predicate runs zero times per
# dialog. It is still on the repository, and the scan figures above are still measured, because a
# saving nobody re-measures is one that quietly stops being a saving.
usage.dialog.max-scans=0
# A FLOOR, which is the unusual direction in this file and is deliberate. It asserts that the cost
# IS linear: fifty times the rows, at least forty times the scan. A fix makes this FAIL, which is
# the point — a ceiling can be satisfied by doing nothing and a floor cannot. When BE6 lands, lower
# it and record the new plan; do not widen it.
usage.scan.min-growth-ratio=40
# The other side of the same comparison, so the two sit together rather than in two commits'
# prose. An equality predicate on an indexed column reads its matches; this is what the LIKE's
# 50,000 becomes.
usage.indexed.max-rows-examined=64
# What the hot path pays. Bounded by the POST's declared reference fields, not by the table — and
# the assertion is EQUALITY across the three sizes rather than this ceiling alone, so growing the
# fixture cannot absorb the finding.
#
# SH1034 re-measured it against the shipped `reindex` instead of SH1033's prototype: **6, not 3**.
# The difference is honest and worth leaving visible rather than smoothing over — the prototype
# counted the delete and two inserts and was handed the field list, while the real path also reads
# which of the post-type's attributes hold references. Twice the prototype's figure, still flat at
# 1,000 / 10,000 / 50,000 rows, and still two under this ceiling. The field-list read is the next
# thing to remove if this ever needs to come down: it is the same answer for every post of a type.
usage.maintenance.max-statements-per-write=8
#
# --- The cost of finding out (SH597) ---
#
# ShAgentDiscoveryCostTest scores the one thing every number above is blind to: the PATH. Each of
# them scores a SURFACE -- `tools/list`, a canonical response, a task an agent has already decided
# how to do. P2 does not claim a surface is small; it claims *one call replaces a session*, and that
# is a property of a path: cold start to the first correct action.
#
# An intent is a job with a known right first move. The cold-start ladder is walked in cost order --
# rung 1 `GET /agent/context?include=all,manifest&format=terse`, rung 2 the full endpoint index --
# and the cost is every rung read up to and including the one whose body NAMES the move, plus the
# move, which is executed and required to succeed. A `features` flag is not a naming: `diagnostics:
# true` is exactly what a replication round had in front of it while it grepped store/logs instead.
#
# Measured 2026.3, Block M, on the class's own database. Third column is SH683's re-measurement,
# after SH601 put `/agent/diagnostics` and `/agent/changes` in `startHere`:
#   intent                 answered by   calls   tokens   +SH600    SH683
#   diagnose-5xx           context           2     3307     3315     1041
#   recall-conventions     context           1      864      872      939
#   reuse-a-blueprint      context           2     1348     1356     1438
#   prove-the-work         context           2      884      892      959
#   resume-a-session       context           2     3285     3292     1019
#   write-without-ids      context           2      916      924      991
#                                                 -----    -----    -----
#                                                 10604    10651     6387
#
# 10651 -> 6387, a 40% fall, and the shape matters more than the number: every one of the six is now
# answered at RUNG 1. `diagnose-5xx` and `resume-a-session` cost 3 calls and ~3300 tokens each
# because `startHere` named neither, so the only route to them was the ~2400-token endpoint index.
# SH601 named them and both fell to a third. The other four drifted up ~70 tokens each between the
# two runs -- prose on the pack, which is what the ~10% headroom is for.
#
# SH683 is why these ceilings are re-measured rather than inherited. They sat at 3650 for two of the
# six long after the fix that made them 1041 and 1019: an `isLessThanOrEqualTo` cannot object to an
# improvement, so the surface they guard could have grown 3.5x before anything failed, and the win
# was written nowhere a build could see.
#
# Call ceilings are exact: a rung count is deterministic, and one more rung is a protocol change
# rather than noise. Token ceilings keep ~10% headroom so a longer purpose line does not fail the
# build. The total is the headline, and it is a sum of INDEPENDENT cold starts -- every intent that
# needs rung 2 is paying for the one-call promise not holding, and summing one session's bill would
# hide exactly that.
#
# THE TOTAL ALSO HAS A FLOOR, and it is the only one (SH683). A benchmark that only fails upward
# records history in one direction: the next 40% win is absorbed in silence exactly as this one was.
# The floor carries ~5% rather than the ceiling's 10%, and the asymmetry is deliberate -- upward
# drift is noise (a longer purpose line), while 5% off six independent cold starts is a protocol
# change somebody made on purpose and owes this file a number for. It is on the TOTAL only: a floor
# per intent would put six tripwires under anyone who improved one row, and the headline is the
# figure the finding is about.
benchmark.discovery.diagnose-5xx.calls=2
benchmark.discovery.diagnose-5xx.tokens=1150
benchmark.discovery.recall-conventions.calls=1
benchmark.discovery.recall-conventions.tokens=1030
benchmark.discovery.reuse-a-blueprint.calls=2
benchmark.discovery.reuse-a-blueprint.tokens=1580
benchmark.discovery.prove-the-work.calls=2
benchmark.discovery.prove-the-work.tokens=1050
benchmark.discovery.resume-a-session.calls=2
benchmark.discovery.resume-a-session.tokens=1120
benchmark.discovery.write-without-ids.calls=2
benchmark.discovery.write-without-ids.tokens=1090
benchmark.discovery.total.tokens=7000
benchmark.discovery.total.floor=6050

# SH603 -- the SECOND task shape, scored with SH597's metric.
#
# The strongest evidence this project has about its protocol is twelve replication rounds, and they
# are also its narrowest: one agent, one instance, one family of sources, a corpus the same reader
# helped design. That finds defects and cannot tell a protocol that is genuinely discoverable from
# one a familiar reader has memorised. This is a shape nothing was tuned for -- build a small site
# from an empty instance, no capture, no corpus -- and the deliverable is the DELTA against the
# discovery ladder rather than either number alone.
#
# MEASURED: 5 calls and 1053 estimated tokens for the whole shape -- read the pack, read the write
# vocabulary, plan the batch, apply it, verify the result.
#
# The first reading was 941 and was measuring NOTHING: two of the five calls answered 400 and the
# last one 404, so the number was the cost of failing. The benchmark asserts every step's status
# before it asserts any ceiling, because a cost benchmark that passes on a failed run reports a
# figure nobody can act on and looks like evidence. That guard is the reason this line is honest.
#
# The delta, which is the deliverable: a single DISCOVERY intent costs between 939 and 1438 tokens
# to reach its first correct move (`recall-conventions` 939, `reuse-a-blueprint` 1438, re-measured
# by SH683 after SH601 collapsed the two expensive rows). Building a site from nothing costs about
# what the cheapest of them costs. So the shape nothing was tuned for is not more expensive than the
# tuned one, which is the answer SH603 wanted: P2 is not an artefact of a familiar reader having
# memorised the surface. The band was 950-3650 when SH603 ran, and the conclusion survives its
# narrowing -- which is the stronger reading, because the tuned shape got four times cheaper and the
# untuned one did not have to.
#
# The ceilings carry headroom because the number that matters is the ORDER OF MAGNITUDE. What has to
# fail here is a shape that starts costing several times a tuned one -- that would mean the twelve
# replication rounds were measuring their own tuning -- not a step somebody legitimately added.
benchmark.authoring.build-a-small-site.calls=8
benchmark.authoring.build-a-small-site.tokens=1400

# --- Live, against a site big enough to be honest (SH714) ---
#
# Every ceiling above this line was measured against a fixture: one site, one post-type,
# three posts. That is the right shape for catching a field somebody added to a DTO, and it
# is silent about the number an agent actually pays — a listing that fits its budget on three
# rows and blows it on three hundred is exactly what a fixture cannot see.
#
# `mcp-concurrency`'s sibling `mcp-budget.conformance.mjs` seeds a site of 121 posts across 6
# folders on a running instance, calls every tool over the MCP wire, and holds the result here.
# The numbers are read from this file rather than restated in the suite: SH673's defect was a
# constant drifting from its declaration, and the cure for that is one copy, not two that agree.
#
# ## Per row, not per response
#
# The per-row figures are the load-bearing ones. A total says how big this fixture is; the row
# says what the SHAPE costs, and it is the number that survives the fixture growing. Both `find`
# and `changes` were measured flat across 5, 25 and 100 rows, so a row really is a constant.
#
# Measured 2026-08-13, 121 posts: find 20.5-22.8/row, changes 38.2-43.7/row. The ceilings carry
# the ~20% headroom every number in this file carries, so a fixture rename does not fail a build
# and a new field on every row does.
live.find.row=27
live.changes.row=52
#
# The rest are whole responses on a fixture this suite controls end to end. `context` is absent
# on purpose: the pack describes the INSTANCE, so its size depends on what else is on the box —
# and it does not need a number here, because it declares and enforces its own (`budget est=…
# limit=…`), which the suite asserts against instead. That is the check SH723 shipped for the
# one response that produced the largest payload and had no ceiling at all.
#
# ## The feed's ceiling (SH723)
#
# `changes` is the one below that does NOT get a whole-response number, for the pack's reason: it
# declares and enforces its own. This is that ceiling, and it lives here rather than only in
# `ShAgentProperties.Changes` so a raise is the same reviewable act every other line in this file
# demands — `ShAgentChangesTest` asserts the two agree, which is SH673's one-copy rule.
#
# 6000 is chosen against the measured row above: the DEFAULT call (50 rows) is 2600 at the
# ceiling and so is never cut, while `limit=500` — 20,000 estimated tokens before this shipped —
# gets what fits and a cursor for the rest.
live.changes.budget=6000
live.read.post=80
live.digest.post=40
live.verify.site=80
live.assets.site=20
live.marketplace=130
#
# ## Authoring through the files against the API (SH1141)
#
# P4 says files beat APIs for authoring. cli/test/authoring-files-cost.test.mjs counts it on one task,
# renaming a product in 10 of 30 posts, both ways on one fixture, counting only what reaches the
# agent's context: the files path pays pull's and push's stdout, a Grep, a Read of every file it
# changes (the harness refuses an Edit on an unread file) and one Edit each; the API path pays a
# text find, one batched read and one batch carrying each post's whole new body.
#
# Measured 2026-09-25: files 4072 tokens (760 written by the agent), API 5245 (2390 written).
# 1.29x in all, 3.14x of what the agent writes. The Read before each Edit spends most of what the
# projection saves on the way in; the saving that survives is on the way out, where the API makes
# the agent restate a body it changed one line of. So P4 holds on this task, by less than its own
# argument implied, and for a different reason than "two round trips".
#
# The ceilings carry ~5% over the measured totals; the ratio floors sit just under what was
# measured, in tenths like every ratio here, so the files path losing its edge fails the build.
authoring.files.tokens=4300
authoring.api.tokens=5500
authoring.min-token-ratio=12
authoring.min-sent-ratio=30

# SH1254 — what applying the Quilhara showcase package answers, estimated by ShTokenBudget over the
# ShBlueprintApplied JSON, read by ShBlueprintAccessibilityTest. The report lists every op (17
# post-types, 134 content ops, 13 assets), so it grows with the package; P3 makes that a number.
# Measured 2026-10-28: ~4261 tokens. The ceiling carries ~5% over it, so a package that grows says so.
# SH1256 grew it on purpose: the feature tour and the search page add 2 post-types, 1 layout, 2
# folders and 61 content ops (nine tour pages and a search page, each in two languages, with their
# sections and a menu item). Measured the same day: ~7817 tokens, so the ceiling is ~5% over that.
blueprint.apply.quilhara=8200
