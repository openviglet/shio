#
# SH1048 — what each console read costs, in bytes, for a fixed fixture.
#
# The other half of P3. `token-budgets.properties` governs the agent's responses because tokens are
# what an agent pays; a curator pays *bytes*, over a connection, on every screen — and until SH1048
# nothing measured them. These are the numbers a payload regression has to move before the build
# notices: somebody adds a convenient field to a listing DTO, every row grows, and three releases
# later the console is entity-shaped again.
#
# Measured by ShConsoleCacheFilterTest against its own small fixture — one site, one post type, one
# widget, three posts — so a breach means the SHAPE got bigger rather than the database did. It
# prints every size on every run, green or red: a budget only ever read at the moment it fails is
# one whose ceilings drift upward a breach at a time.
#
# Raise a ceiling deliberately and say why in the commit, the way SH113's file has been governed
# since it was written. Each carries roughly 25% of room, which is a measured compromise rather
# than a round number: these payloads are small enough that a fixture name of a different length
# moves them by a percent or two, and the gate also asserts at least 10% is free — a ceiling on its
# measurement refuses the next field instead of pricing it (SH736's rule, one gate over).
#
# A ceiling far above its measurement guards nothing, which is why none of these is generous. The
# first draft had post-type.list at 2400 against 418 measured; it would have passed a listing that
# had quintupled.
#
# SH1217 raised it 670 -> 760: each row now carries `pages` and `lastChange`, 52 bytes on this
# fixture's one site (551 -> 603), which left exactly the 10% the gate asks for. The new ceiling is
# ~25% over the measurement, like the others.
console.bytes.site.list=760
console.bytes.post-type.list=530
# The widget catalogue is the instance's own seed, not this fixture's — every widget the console
# can draw, each with a name and a class. It is the largest console read here and the one a new
# widget legitimately grows, so its room is the same 20% and its raises will be the frequent ones.
console.bytes.widget.list=2600
console.bytes.object.list=1020
console.bytes.post-unified.get=1400
console.bytes.folder.get=1220
# The two the fixture leaves empty. Their ceilings are about the ENVELOPE — `{"rows":[],…}` — and
# the test declares them in EMPTY_BY_FIXTURE so nobody reads them as guarding a row shape. Room to
# spare on purpose: a field added to the envelope is a real change and should be priced, not
# refused by a wall two bytes above it.
console.bytes.history.recent=200
console.bytes.staticfile.list=200
