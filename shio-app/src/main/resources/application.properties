## Shio
shio.mgmt.enabled=true
shio.git.url=GIT_URL_HERE
shio.git.token=DEFINE_TOKEN_HERE
shio.keycloak=false
shio.multi-tenant=false
shio.keycloak-admin-id=
shio.url=http://localhost:2710
shio.allowedOrigins=localhost

## Keycloak / OAuth2 (uncomment and configure to enable)
#spring.security.oauth2.client.registration.keycloak.client-id=shio-app
#spring.security.oauth2.client.registration.keycloak.client-secret=YOUR_CLIENT_SECRET
#spring.security.oauth2.client.registration.keycloak.scope=openid
#spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
#spring.security.oauth2.client.registration.keycloak.redirect-uri=http://localhost:2710/login/oauth2/code/shio-app
#spring.security.oauth2.client.provider.keycloak.issuer-uri=http://localhost:8080/realms/shio
#spring.security.oauth2.client.provider.keycloak.jwk-set-uri=http://localhost:8080/realms/shio/protocol/openid-connect/certs
#spring.security.oauth2.client.provider.keycloak.user-info-uri=http://localhost:8080/realms/shio/protocol/openid-connect/userinfo

shio.config.system="/system"
shio.config.auth="/provider/auth/%s"
shio.config.exchange="/provider/exchange/%s"
shio.website.nashorn=--persistent-code-cache,--optimistic-types=true,-pcc,--class-cache-size=50000
shio.website.javascript.engine=nashorn
shio.plugin.blogger=com.viglet.shio.plugin.ShImporterBloggerPlugin

## Compression
server.compression.enabled=true
server.compression.mime-types=application/json,text/css,application/javascript
server.compression.min-response-size=2048

## Content Delivery API edge behaviour (SH3) — defaults shown; uncomment to tune.
## Caching: Cache-Control max-age on /api/v2/cda/** reads (0 => no-cache, still ETag-revalidated).
#shio.cda.cache.max-age-seconds=60
## Per-token rate limit (in-memory token bucket; per-JVM): 120 burst, refilling 120/min (~2 req/s).
#shio.cda.rate-limit.enabled=true
#shio.cda.rate-limit.capacity=120
#shio.cda.rate-limit.refill-tokens=120
#shio.cda.rate-limit.refill-period-seconds=60

## Outbound webhooks (SH12) — fired on publish/unpublish/delete to per-site
## subscriptions (/api/v2/site-webhook). HMAC-SHA256 signed, retried best-effort,
## off the request thread. Defaults shown; uncomment to tune.
#shio.webhook.enabled=true
#shio.webhook.connect-timeout-millis=3000
#shio.webhook.read-timeout-millis=5000
#shio.webhook.max-attempts=3
#shio.webhook.retry-backoff-millis=2000

## Short-lived preview tokens (SH13) — the console mints an expiring PREVIEW-env
## token (POST /api/v2/preview-token) and hands the editor a preview URL at the
## site front-end. Built on SH5 draft-preferred reads. Defaults shown; uncomment to tune.
#shio.cda.preview.enabled=true
#shio.cda.preview.ttl-seconds=900
#shio.cda.preview.max-ttl-seconds=3600
#shio.cda.preview.path=/api/preview
#shio.cda.preview.token-param=token
#shio.cda.preview.url-param=url


## H2 - Datasource
spring.datasource.url=jdbc:h2:file:./store/db/shioDB;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

## H2 - JPA
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

## Liquibase (single shared schema for multi-tenant) — schema is owned by the
## versioned changelogs under db/changelog, not by Hibernate ddl-auto.
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.enabled=true
spring.liquibase.default-schema=PUBLIC

## JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# enable_lazy_load_no_trans is load-bearing for two cold paths that live
# outside of any Spring transaction context:
#   1. ShGraphQLSchema.buildSchema walks ShPostType.shPostTypeAttrs during
#      GraphQL bean initialization, before any request thread exists.
#   2. Integration tests that inspect lazy relations on detached entities.
# The seeding chain (ShOnStartup.run) no longer needs it — that one is now
# properly @Transactional — but removing the flag breaks the two paths
# above. Wrapping GraphQL schema build in a TransactionTemplate and moving
# the tests into @Transactional boundaries would allow removing this;
# tracked separately.
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.properties.jakarta.persistence.sharedCache.mode=ALL
spring.jpa.properties.hibernate.generate_statistics=false
spring.jmx.default-domain=com.viglet.shio.persistence.model

## H2
spring.h2.console.enabled=false
spring.h2.console.path=/h2
spring.h2.console.settings.web-allow-others=true

## Log
logging.level.org.springframework=INFO
logging.level.com.viglet=INFO
# Hibernate 7 emits HHH90030002 at WARN every time an uninitialized lazy
# collection is detached under enable_lazy_load_no_trans — which is the
# expected behavior of that flag (see JPA block above). Silence the noise
# here; flip back to WARN locally if you are chasing a real lazy-loading
# bug.
logging.level.org.hibernate.orm.collection=ERROR
logging.file.name=store/logs/shio.log
logging.logback.rollingpolicy.max-file-size=25MB
logging.logback.rollingpolicy.max-history=10

#spring.profiles.active=development
#spring.profiles.active=ui-dev
spring.profiles.active=production
#server.contextPath=/shio
server.port=${PORT:2710}

# management.security.enabled=false

## To enable the @JsonView
spring.jackson.mapper.DEFAULT_VIEW_INCLUSION=true

logging.level.org.hibernate.stat=INFO
logging.level.org.hibernate.SQL=INFO

#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

spring.servlet.multipart.max-file-size=1024MB
spring.servlet.multipart.max-request-size=1024MB
spring.mvc.async.request-timeout=3600000

spring.web.resources.static-locations=classpath:/public/,classpath:/ui/public/
spring.thymeleaf.prefix=classpath:/ui/templates/
spring.output.ansi.enabled=always
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/js/**,/css/**,/img/**,/*.png
#spring.datasource.hikari.connectionTimeout=30000
#spring.datasource.hikari.idleTimeout=600000
#spring.datasource.hikari.maxLifetime=1800000

management.endpoints.web.exposure.include=*

spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=localhost@localhost
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false
spring.mail.test-connection=false

server.tomcat.use-relative-redirects=true
server.servlet.session.cookie.name=SHJSESSIONID

## GraphQL
spring.graphql.graphiql.enabled=true
spring.graphql.path=/graphql
