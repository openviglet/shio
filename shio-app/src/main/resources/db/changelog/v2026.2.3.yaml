databaseChangeLog:
  # SH15 — Scheduled publish/unpublish.
  # Two nullable instants on sh_post_unified (carried on the DRAFT row). Types
  # kept DB-agnostic (TIMESTAMP) per ShLiquibaseChangelogAgnosticTest.
  - changeSet:
      id: sh15-post-unified-publish-scheduled-date
      author: alexandre
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: sh_post_unified
                columnName: publish_scheduled_date
      changes:
        - addColumn:
            tableName: sh_post_unified
            columns:
              - column:
                  name: publish_scheduled_date
                  type: TIMESTAMP
  - changeSet:
      id: sh15-post-unified-unpublish-scheduled-date
      author: alexandre
      preConditions:
        - onFail: MARK_RAN
        - not:
            - columnExists:
                tableName: sh_post_unified
                columnName: unpublish_scheduled_date
      changes:
        - addColumn:
            tableName: sh_post_unified
            columns:
              - column:
                  name: unpublish_scheduled_date
                  type: TIMESTAMP
