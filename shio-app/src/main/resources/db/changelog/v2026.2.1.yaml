databaseChangeLog:
  # SH12 — Outbound webhooks on publish/unpublish/delete.
  # Per-site webhook subscriptions + their event filter. Types kept DB-agnostic
  # (VARCHAR / TIMESTAMP / boolean) per ShLiquibaseChangelogAgnosticTest.
  # SH26: preserve identifier case on PostgreSQL (does not propagate from the
  # baseline through `include`, so repeated per file).
  - objectQuotingStrategy: QUOTE_ALL_OBJECTS
  - changeSet:
      id: sh12-create-site-webhook
      author: alexandre
      # SH22: TENANT_ID -> tenant_id (PostgreSQL @TenantId predicate fix, see
      # v2026.2_baseline.yaml changeset -6). validCheckSum: ANY accepts the edited
      # checksum on databases that already ran the original changeset.
      validCheckSum: ANY
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: site_webhook
      changes:
        - createTable:
            tableName: site_webhook
            columns:
              - column:
                  name: id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: PK_site_webhook
              - column:
                  name: tenant_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: site_id
                  type: VARCHAR(255)
              - column:
                  name: name
                  type: VARCHAR(100)
              - column:
                  name: target_url
                  type: VARCHAR(1024)
              - column:
                  name: secret
                  type: VARCHAR(255)
              - column:
                  name: enabled
                  type: boolean
              - column:
                  name: created_date
                  type: TIMESTAMP
              - column:
                  name: owner
                  type: VARCHAR(255)
  - changeSet:
      id: sh12-create-site-webhook-event
      author: alexandre
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: site_webhook_event
      changes:
        - createTable:
            tableName: site_webhook_event
            columns:
              - column:
                  name: site_webhook_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: VARCHAR(16)
        - addForeignKeyConstraint:
            constraintName: fk_site_webhook_event_webhook
            baseTableName: site_webhook_event
            baseColumnNames: site_webhook_id
            referencedTableName: site_webhook
            referencedColumnNames: id
