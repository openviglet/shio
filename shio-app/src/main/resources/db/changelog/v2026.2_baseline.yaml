databaseChangeLog:
# SH26: this baseline was generated from H2 with PascalCase, case-bearing
# identifiers (ShPostType, TENANT_ID, DTYPE). Hibernate references them quoted
# (globally_quoted_identifiers=true). PostgreSQL folds *unquoted* identifiers to
# lower-case, so without quoting Liquibase would create `shposttype` while
# Hibernate looks for "ShPostType" -> mismatch. QUOTE_ALL_OBJECTS makes Liquibase
# preserve the exact case on every engine, matching Hibernate. Set at the
# changelog level (not per-changeSet) so it does not alter changeset checksums.
# It does NOT propagate through `include`, so each changelog file repeats it.
- objectQuotingStrategy: QUOTE_ALL_OBJECTS
- changeSet:
    id: 1780773187985-1
    author: alexa (generated)
    changes:
