#### Database connection (dev H2 file store) ####
# Mirrors Turing's liquibase.properties. Used by the liquibase-maven-plugin
# to generate/diff changelogs against the running dev schema. The app itself
# applies changelogs via spring.liquibase.* at boot (see application.properties).
url=jdbc:h2:file:./store/db/shioDB;DATABASE_TO_UPPER=false;CASE_INSENSITIVE_IDENTIFIERS=true;AUTO_SERVER=TRUE
username=sa
password=
driver=org.h2.Driver

#### File parameters ####
# Satisfies Maven's mandatory changeLogFile validation and tells Liquibase
# where to write the result of `liquibase:generateChangeLog` / `diff`.
changeLogFile=src/main/resources/db/changelog/v2026.2_update.yaml
diffChangeLogFile=src/main/resources/db/changelog/v2026.2_update.yaml

#### Extra settings ####
searchPath=src/main/resources
diffTypes=tables,columns,indexes,foreignkeys,primarykeys
