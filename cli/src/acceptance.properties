# The acceptance bar a replication round is judged against (SH860).
#
# `docs/agents/replication.md` holds the criterion in prose — ten checkable lines and the
# exclusion that makes the rest closable. This file is the machine-readable half: one key
# per kind of finding `shio judge` can emit, and the number of subjects that may carry it.
#
# Written on `token-budgets.properties`' pattern, for its reason. A number here is a value,
# a comment saying what it protects, and a gate that fails on a breach — not a fifth debt
# ledger; SH594 already counts four, and a ledger is a place findings accumulate while a
# bar is a place a decision is recorded. Raising a number is allowed and is a deliberate,
# reviewable act. Raising one without saying why in the commit message is the thing this
# file exists to prevent.
#
# A value is either a count — the number of subjects that may carry this kind before the
# round is held — or the word `noted`, which means the kind is reported on every run and
# never holds it. `noted` is not "ignored": every one appears in the report under its own
# heading with the bar that admitted it, because a finding nobody prints is the silence
# this whole chain keeps paying for (P9).
#
# A kind with NO entry here holds the round, and that is deliberate in the other
# direction: an undeclared kind is one nobody has decided about, and accepting it by
# omission is how a criterion stops meaning anything. `acceptance-bar.test.mjs` asserts
# every kind the mappers in `commands/judge.mjs` can produce has a line, so the failure
# arrives at the build rather than at the release.
#
# --- Criterion 1: verify reports 0 errors ---
#
# One key for every rule, because the criterion is about the count and not about which
# rule produced it. Warnings never reach `judge` — `fromVerify` filters them — and the
# per-rule baseline (SH410's accept list, criteria 4 and 5) is applied inside `verify`
# before this sees anything, so a finding here is one no baseline admitted.
verify.* = 0

# --- Criterion 3: 0 losses the mode does not claim ---
#
# `diff` already excludes the shortfalls the mode claims by design — SH577 is the task
# that made `by design` a category rather than a footnote — so what reaches this is loss
# the replica cannot account for.
diff.facts-lost = 0

# A link that now points at the source origin is not a shortfall, it is the replica
# sending its readers away (SH586). Never accepted at any count.
diff.links-went-home = 0

# --- Criterion 2: every captured route answers 200 anonymously ---
#
# In the slash spelling the source served (SH467). A path the replica serves nothing at is
# the one finding that is also a broken promise to a visitor.
diff.page-missing = 0

# --- Criteria 4, 5, 6: what a browser render reports ---
#
# `page-dangling-token` (SH851) and `page-unstyled` (SH686) are held to a recorded
# baseline rather than to zero, and that comparison happens inside `audit` against the
# baseline file — so an error arriving here is an increase over it, which criteria 4 and 5
# say holds the round.
audit.error = 0

# --- A count that rose since the last round (SH869) ---
#
# `--since` subtracts the last recorded round from this one, and a kind whose count went up is
# reported as this. Zero because the movement the mechanism exists for is exactly this shape: three
# rounds of `verify: 0 errors` over dangling `var()` occurrences going 231 → 958 → 231, invisible to
# every instrument because each answers about one run.
#
# A count that FELL is reported and never held. A round that fixed something is not a round to
# refuse, and treating an improvement as a change somebody has to justify is how a ratchet becomes a
# thing people route around.
round.regressed = 0

# --- Which instruments a mode's bar rests on (SH865) ---
#
# A verdict of ACCEPTED is a claim that the criterion was met, and an instrument that did not run
# tested nothing. SH589's rule is that an abstention is never green, and SH860 nonetheless reached
# `accepted` on a round reporting `2 unproven (diff, snapshot)` — with the paragraph explaining that
# it proved nothing printed directly under the heading that said ACCEPTED. A reader who greps for the
# verdict got the opposite of what the prose said.
#
# `unproven` still does not fail a build on its own, which is SH411's split and the reason a browser
# stays optional. What changed is that the split is now DECLARED rather than global: snapshot is
# optional for authorable because pixels are not that mode's criterion, and it is the whole criterion
# for fidelity, so a fidelity round without it is INCONCLUSIVE rather than accepted. `diff` is in both
# because it is also what tells `judge` which mode the round is in at all.
mode.authorable.requires = verify diff
mode.fidelity.requires = verify diff snapshot

# --- The exclusion that makes the rest closable ---
#
# > Design equivalence with the source is not an acceptance criterion for authorable mode.
#
# It is fidelity's criterion. Applying it to authorable's output is what kept Block Q open
# across 131 tasks and six declared closes: that class of finding has no bottom — spacing
# rhythm, type scale, radii, shadows, hover states, dark mode, breakpoints — and
# `www.viglet.org` declares 49 design tokens where the Shio section theme reads 14. An
# authorable page is presented by a Shio theme ON PURPOSE (SH510) and is held to its
# content, its structure and its routes.
#
# So a pixel difference is reported on an authorable round and does not hold it. On a
# fidelity round it is the whole criterion, at 0.00%.
snapshot.pixels-differ.authorable = noted
snapshot.pixels-differ.fidelity = 0
