packages:
  - "shio-client"
  - "shio-model"
  - "shio-sections"
  - "shio-react-sdk"
  - "shio-js-sdk"
  - "create-shio-app"
  - "cli"
  - "claude-plugin"
  - "shio-react"
  - "shio-site"
  - "shio-examples/*"

# pnpm 11 no longer reads the "pnpm" field in package.json — native build
# scripts must be allowlisted here instead (was package.json > pnpm.onlyBuiltDependencies).
onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"

# pnpm 11 prompts before purging a node_modules created by an older pnpm layout.
# The frontend-maven-plugin and CI run pnpm with no TTY, where that prompt aborts
# the install (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY) — let it purge silently.
confirmModulesPurge: false

# An unmet peer range was a warning nobody reads, and the console bundle became
# undeliverable (SH242): a grouped Dependabot bump set monaco-editor to 0.56.0 while
# monaco-graphql declares "monaco-editor: >= 0.20.0 < 0.53", pnpm resolved it anyway,
# and `pnpm run compile:build` — i.e. `mvn package` and the release jar — died in the
# Monaco worker bundle. This turns "resolved a version the dependent does not support"
# into ERR_PNPM_PEER_DEP_ISSUES at the bump, which is the only moment it is cheap.
# It fires on a *resolving* install, so a manifest change (what a bump is) is checked;
# an install against an unchanged lockfile is not, which is why the resolution itself
# is asserted too (shio-react/test/monaco-workers-resolve.test.mjs).
# Note the setting belongs here and not in .npmrc: pnpm 11 reads it only from this file,
# and in .npmrc it silently downgrades to the warning it is meant to replace.
strictPeerDependencies: true

# The one peer range this tree is allowed to exceed, named and scoped to its dependent.
# eslint-plugin-jsx-a11y 6.10.2 (the latest; SH1054 added it) declares eslint up to ^9,
# and the console lints on eslint 10. Its recommended rules run clean on 10 in
# `pnpm --filter shio-react lint`, so the range is stale rather than the pairing broken.
# Unnamed, strict mode refuses the next resolving install, a design-system bump included
# (SH1177). Delete this entry when the plugin's own range admits eslint 10:
# shio-react/test/peer-ranges.test.mjs fails on an exception nothing needs any more.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jsx-a11y>eslint': '10'

# pnpm 11 refuses a dependency published more recently than `minimumReleaseAge` — a
# supply-chain guard aimed at a compromised release being pulled in before anybody has
# looked at it. It is on by default and it is worth keeping.
#
# The design system is the one dependency that guard cannot be about (SH915). It is
# first-party: published from viglet-design-system by the same people, consumed the day
# it ships precisely because the console is migrating onto it, and never a package a
# stranger could push to. Waiting a day for it buys nothing and costs the whole of
# Blocks AQ and AR, whose every task starts by importing `/bento`.
#
# Excluded by NAME rather than by name@version, which is the change SH915 made. The
# pinned form was auto-written by pnpm on each bump and only ever excused the version in
# front of it: the lockfile-verification pass then rejected the NEXT release, so
# `pnpm test` and `pnpm run compile:build` stopped before running anything — the dep
# check happens ahead of every script, not at build time. Pinning also meant this list
# grew a dead line per release, each one reading like a decision somebody made.
#
# Deliberately not `minimumReleaseAge: 0`, which would drop the guard for all 493
# entries. This is one package, named.
minimumReleaseAgeExclude:
  - '@viglet/viglet-design-system'

# CodeMirror 6 must be a singleton per page: an extension built against one copy
# of @codemirror/state is unrecognised by another, and the editor dies with
# "Unrecognized extension value in extension set ([object Object])" inside
# EditorState.create. Nothing declares a conflict — @uiw/react-codemirror
# resolved state 6.7.1 / view 6.43.6 / language 6.12.4 while @codemirror/lang-html
# and lang-javascript pulled state 6.6.0 / view 6.43.0 / language 6.12.3, so
# html() and githubDark produced facets from a foreign class. Three copies of
# state and two of view; pin one of each. Every consumer's range is >=6.0.0 or
# ^6.x, so the newest satisfies all of them.
overrides:
  '@codemirror/state': '6.7.1'
  '@codemirror/view': '6.43.6'
  '@codemirror/language': '6.12.4'
