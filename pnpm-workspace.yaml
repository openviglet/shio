packages:
  - "shio-client"
  - "shio-model"
  - "shio-sections"
  - "shio-react-sdk"
  - "shio-js-sdk"
  - "create-shio-app"
  - "cli"
  - "claude-plugin"
  - "shio-react"
  - "shio-site"
  - "shio-examples/*"

# pnpm 11 no longer reads the "pnpm" field in package.json — native build
# scripts must be allowlisted here instead (was package.json > pnpm.onlyBuiltDependencies).
onlyBuiltDependencies:
  - esbuild
  - "@tailwindcss/oxide"

# pnpm 11 prompts before purging a node_modules created by an older pnpm layout.
# The frontend-maven-plugin and CI run pnpm with no TTY, where that prompt aborts
# the install (ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY) — let it purge silently.
confirmModulesPurge: false

# An unmet peer range was a warning nobody reads, and the console bundle became
# undeliverable (SH242): a grouped Dependabot bump set monaco-editor to 0.56.0 while
# monaco-graphql declares "monaco-editor: >= 0.20.0 < 0.53", pnpm resolved it anyway,
# and `pnpm run compile:build` — i.e. `mvn package` and the release jar — died in the
# Monaco worker bundle. This turns "resolved a version the dependent does not support"
# into ERR_PNPM_PEER_DEP_ISSUES at the bump, which is the only moment it is cheap.
# It fires on a *resolving* install, so a manifest change (what a bump is) is checked;
# an install against an unchanged lockfile is not, which is why the resolution itself
# is asserted too (shio-react/test/monaco-workers-resolve.test.mjs).
# Note the setting belongs here and not in .npmrc: pnpm 11 reads it only from this file,
# and in .npmrc it silently downgrades to the warning it is meant to replace.
strictPeerDependencies: true

minimumReleaseAgeExclude:
  - '@viglet/viglet-design-system@2026.3.2'

# CodeMirror 6 must be a singleton per page: an extension built against one copy
# of @codemirror/state is unrecognised by another, and the editor dies with
# "Unrecognized extension value in extension set ([object Object])" inside
# EditorState.create. Nothing declares a conflict — @uiw/react-codemirror
# resolved state 6.7.1 / view 6.43.6 / language 6.12.4 while @codemirror/lang-html
# and lang-javascript pulled state 6.6.0 / view 6.43.0 / language 6.12.3, so
# html() and githubDark produced facets from a foreign class. Three copies of
# state and two of view; pin one of each. Every consumer's range is >=6.0.0 or
# ^6.x, so the newest satisfies all of them.
overrides:
  '@codemirror/state': '6.7.1'
  '@codemirror/view': '6.43.6'
  '@codemirror/language': '6.12.4'
