# The WebP copies the package ships, cut by polyweave's picture.copies from the originals it bought.
#
#     polyweave picture.copies --root marketplace/orvalha --source polyweave.copies.toml
#
# The originals under assets/source/ are not committed (see .gitignore); each copy's record names
# its source and this table.

