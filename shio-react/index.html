<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viglet Shio CMS</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(220, 38, 38, 0.18), transparent 60%),
          radial-gradient(900px 500px at 80% 90%, rgba(225, 29, 72, 0.18), transparent 60%),
          #0a0a0f;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      body.shio-light-boot {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(220, 38, 38, 0.10), transparent 60%),
          radial-gradient(900px 500px at 80% 90%, rgba(225, 29, 72, 0.10), transparent 60%),
          #fafafa;
        color: #0f172a;
      }

      #shio-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        animation: shio-boot-fade-in 0.4s ease-out;
      }

      .shio-boot-stage {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .shio-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(244, 63, 94, 0.55);
        opacity: 0;
        animation: shio-boot-ring-pulse 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }
      .shio-boot-ring.delay-1 { animation-delay: 0.6s; }
      .shio-boot-ring.delay-2 { animation-delay: 1.2s; }
      .shio-boot-ring.delay-3 { animation-delay: 1.8s; }

      .shio-boot-logo-wrap {
        position: relative;
        width: 88px;
        height: 88px;
        border-radius: 24px;
        background: linear-gradient(135deg, #dc2626, #e11d48);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.06),
          0 20px 40px -10px rgba(220, 38, 38, 0.45),
          0 8px 20px -6px rgba(225, 29, 72, 0.35);
        animation: shio-boot-breathe 2.2s ease-in-out infinite;
      }
      .shio-boot-logo-wrap::before {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 26px;
        background: linear-gradient(135deg, #ef4444, #f43f5e, #f97316, #ef4444);
        background-size: 300% 300%;
        z-index: -1;
        filter: blur(14px);
        opacity: 0.55;
        animation: shio-boot-glow 6s linear infinite;
      }
      .shio-boot-logo-wrap img {
        width: 60px;
        height: 60px;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.25));
      }

      .shio-boot-text {
        margin-top: 2rem;
        text-align: center;
      }
      .shio-boot-text .shio-boot-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        background: linear-gradient(90deg, #ef4444, #f43f5e, #f97316);
        background-size: 200% auto;
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
        animation: shio-boot-shimmer 3s linear infinite;
      }
      .shio-boot-text .shio-boot-subtitle {
        margin-top: 0.35rem;
        font-size: 0.8rem;
        opacity: 0.55;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .shio-boot-progress {
        margin-top: 1.5rem;
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.15);
        overflow: hidden;
        position: relative;
      }
      .shio-boot-progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #ef4444 30%, #f43f5e 70%, transparent);
        transform: translateX(-100%);
        will-change: transform;
        animation: shio-boot-slide 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes shio-boot-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes shio-boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes shio-boot-glow {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
      }
      @keyframes shio-boot-ring-pulse {
        0% { transform: scale(0.55); opacity: 0.7; border-width: 2px; }
        70% { opacity: 0.05; }
        100% { transform: scale(1.25); opacity: 0; border-width: 1px; }
      }
      @keyframes shio-boot-shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes shio-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .shio-boot-ring,
        .shio-boot-logo-wrap,
        .shio-boot-logo-wrap::before,
        .shio-boot-text .shio-boot-title,
        .shio-boot-progress::after {
          animation: none !important;
        }
        .shio-boot-ring { opacity: 0.2; transform: scale(1); }
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("shio-ui-theme");
          var prefersLight = stored === "light"
            || (stored === "system" && window.matchMedia("(prefers-color-scheme: light)").matches)
            || (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (prefersLight) {
            document.documentElement.classList.remove("dark");
            document.addEventListener("DOMContentLoaded", function () {
              document.body.classList.add("shio-light-boot");
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
