<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viglet Shio CMS</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(220, 38, 38, 0.18), transparent 60%),
          radial-gradient(900px 500px at 80% 90%, rgba(225, 29, 72, 0.18), transparent 60%),
          #0a0a0f;
        color: #e5e7eb;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      body.shio-light-boot {
        background:
          radial-gradient(1200px 600px at 20% 10%, rgba(220, 38, 38, 0.10), transparent 60%),
          radial-gradient(900px 500px at 80% 90%, rgba(225, 29, 72, 0.10), transparent 60%),
          #fafafa;
        color: #0f172a;
      }

      #shio-boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        z-index: 9999;
        animation: shio-boot-fade-in 0.4s ease-out;
      }

      .shio-boot-stage {
        position: relative;
        width: 160px;
        height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .shio-boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid rgba(244, 63, 94, 0.55);
        opacity: 0;
        animation: shio-boot-ring-pulse 2.4s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
      }
      .shio-boot-ring.delay-1 { animation-delay: 0.6s; }
      .shio-boot-ring.delay-2 { animation-delay: 1.2s; }
      .shio-boot-ring.delay-3 { animation-delay: 1.8s; }
      .shio-boot-logo-mark {
        position: relative;
        width: 110px;
        height: 110px;
        color: #FFDEAD;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
        animation: shio-boot-breathe 2.2s ease-in-out infinite;
      }
      /* Outer aura — blurred gradient halo. */
      .shio-boot-logo-mark::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(135deg, #ff9a76, #ff6347, #e0341b, #ff9a76);
        background-size: 300% 300%;
        z-index: -2;
        filter: blur(18px);
        opacity: 0.5;
        animation: shio-boot-glow 6s linear infinite;
      }
      /* Gas cloud — soft disc, almost imperceptible edge. */
      .shio-boot-logo-mark::after {
        content: "";
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        background: radial-gradient(circle at center, #FF6347 0%, rgba(255,99,71,0.6) 55%, rgba(255,99,71,0) 100%);
        filter: blur(5px);
        z-index: -1;
        animation: shio-boot-gas 4s ease-in-out infinite;
      }
      @keyframes shio-boot-gas {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50%      { transform: scale(1.08); opacity: 1; }
      }

      /* Chemical-bond animation inside the circle — 6 molecules that fade
         through each other in a 10s loop. Pure SVG + CSS so no font load is
         required before the loader looks right. */
      .shio-boot-molecules {
        width: 62px;
        height: 62px;
        overflow: visible;
      }
      .shio-boot-molecules line,
      .shio-boot-molecules path {
        stroke: #FFDEAD;
        stroke-width: 2.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .shio-boot-molecules circle { fill: #FFDEAD; }
      .shio-boot-molecule {
        opacity: 0;
        transform-origin: center;
        animation: shio-boot-molecule-cycle 10s ease-in-out infinite both;
      }
      .shio-boot-molecule.m-2 { animation-delay: -1.667s; }
      .shio-boot-molecule.m-3 { animation-delay: -3.333s; }
      .shio-boot-molecule.m-4 { animation-delay: -5.000s; }
      .shio-boot-molecule.m-5 { animation-delay: -6.667s; }
      .shio-boot-molecule.m-6 { animation-delay: -8.333s; }
      @keyframes shio-boot-molecule-cycle {
        0%   { opacity: 0; transform: scale(0.7); }
        3%   { opacity: 1; transform: scale(1); }
        14%  { opacity: 1; transform: scale(1); }
        17%  { opacity: 0; transform: scale(0.7); }
        100% { opacity: 0; transform: scale(0.7); }
      }

      .shio-boot-text {
        margin-top: 2rem;
        text-align: center;
      }
      .shio-boot-text .shio-boot-title {
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.01em;
        background: linear-gradient(90deg, #ef4444, #f43f5e, #f97316);
        background-size: 200% auto;
        -webkit-background-clip: text;
                background-clip: text;
        color: transparent;
        animation: shio-boot-shimmer 3s linear infinite;
      }
      .shio-boot-text .shio-boot-subtitle {
        margin-top: 0.35rem;
        font-size: 0.8rem;
        opacity: 0.55;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .shio-boot-progress {
        margin-top: 1.5rem;
        width: 180px;
        height: 3px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.15);
        overflow: hidden;
        position: relative;
      }
      .shio-boot-progress::after {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #ef4444 30%, #f43f5e 70%, transparent);
        transform: translateX(-100%);
        will-change: transform;
        animation: shio-boot-slide 1.6s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes shio-boot-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes shio-boot-breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes shio-boot-glow {
        0% { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
      }
      @keyframes shio-boot-ring-pulse {
        0% { transform: scale(0.55); opacity: 0.7; border-width: 2px; }
        70% { opacity: 0.05; }
        100% { transform: scale(1.25); opacity: 0; border-width: 1px; }
      }
      @keyframes shio-boot-shimmer {
        0% { background-position: 0% 50%; }
        100% { background-position: 200% 50%; }
      }
      @keyframes shio-boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(450%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .shio-boot-ring,
        .shio-boot-logo-mark,
        .shio-boot-logo-mark::before,
        .shio-boot-logo-mark::after,
        .shio-boot-molecule,
        .shio-boot-text .shio-boot-title,
        .shio-boot-progress::after {
          animation: none !important;
        }
        .shio-boot-ring { opacity: 0.2; transform: scale(1); }
        .shio-boot-molecule { opacity: 0; }
        .shio-boot-molecule.m-1 { opacity: 1; transform: scale(1); }
      }

      /* Visible badge shown only when the loader is held via ?loading=1. */
      .shio-boot-test-badge {
        position: fixed;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        padding: 6px 12px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #fff;
        background: linear-gradient(135deg, #dc2626, #ea580c);
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
        z-index: 10000;
      }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("shio-ui-theme");
          var prefersLight = stored === "light"
            || (stored === "system" && window.matchMedia("(prefers-color-scheme: light)").matches)
            || (!stored && window.matchMedia("(prefers-color-scheme: light)").matches);
          if (prefersLight) {
            document.documentElement.classList.remove("dark");
            document.addEventListener("DOMContentLoaded", function () {
              document.body.classList.add("shio-light-boot");
            });
          }
        } catch (e) { /* ignore */ }

        // ?loading=1 → hold the boot loader indefinitely for design/regression
        // testing. main.tsx has a matching guard that skips React mount, so
        // the static markup inside #root stays visible with animations playing.
        try {
          if (new URLSearchParams(globalThis.location.search).has("loading")) {
            globalThis.__SHIO_LOADING_TEST__ = true;
            document.addEventListener("DOMContentLoaded", function () {
              var badge = document.createElement("div");
              badge.className = "shio-boot-test-badge";
              badge.textContent = "Loading · Test Mode · ?loading=1";
              document.body.appendChild(badge);
            });
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="shio-boot-loader" role="status" aria-live="polite" aria-label="Loading Viglet Shio CMS">
        <div class="shio-boot-stage">
          <div class="shio-boot-ring"></div>
          <div class="shio-boot-ring delay-1"></div>
          <div class="shio-boot-ring delay-2"></div>
          <div class="shio-boot-ring delay-3"></div>
          <div class="shio-boot-logo-mark" aria-label="Viglet Shio CMS">
            <svg class="shio-boot-molecules" viewBox="0 0 100 100" aria-hidden="true">
              <g class="shio-boot-molecule m-1">
                <line x1="28" y1="50" x2="72" y2="50" />
                <circle cx="28" cy="50" r="7" />
                <circle cx="72" cy="50" r="7" />
              </g>
              <g class="shio-boot-molecule m-2">
                <path d="M28,68 L50,38 L72,68" />
                <circle cx="28" cy="68" r="5" />
                <circle cx="50" cy="38" r="8" />
                <circle cx="72" cy="68" r="5" />
              </g>
              <g class="shio-boot-molecule m-3">
                <line x1="50" y1="50" x2="25" y2="28" />
                <line x1="50" y1="50" x2="75" y2="28" />
                <line x1="50" y1="50" x2="25" y2="72" />
                <line x1="50" y1="50" x2="75" y2="72" />
                <circle cx="50" cy="50" r="7" />
                <circle cx="25" cy="28" r="4.5" />
                <circle cx="75" cy="28" r="4.5" />
                <circle cx="25" cy="72" r="4.5" />
                <circle cx="75" cy="72" r="4.5" />
              </g>
              <g class="shio-boot-molecule m-4">
                <path d="M50,28 L28,68 L72,68 Z" />
                <circle cx="50" cy="28" r="7" />
                <circle cx="28" cy="68" r="5" />
                <circle cx="72" cy="68" r="5" />
              </g>
              <g class="shio-boot-molecule m-5">
                <line x1="18" y1="50" x2="82" y2="50" />
                <circle cx="18" cy="50" r="5.5" />
                <circle cx="39.3" cy="50" r="5.5" />
                <circle cx="60.6" cy="50" r="5.5" />
                <circle cx="82" cy="50" r="5.5" />
              </g>
              <g class="shio-boot-molecule m-6">
                <path d="M50,22 L74,36 L74,64 L50,78 L26,64 L26,36 Z" />
                <circle cx="50" cy="22" r="4.5" />
                <circle cx="74" cy="36" r="4.5" />
                <circle cx="74" cy="64" r="4.5" />
                <circle cx="50" cy="78" r="4.5" />
                <circle cx="26" cy="64" r="4.5" />
                <circle cx="26" cy="36" r="4.5" />
              </g>
            </svg>
          </div>
        </div>
        <div class="shio-boot-text">
          <div class="shio-boot-title">Viglet Shio CMS</div>
          <div class="shio-boot-subtitle">Content Management System</div>
        </div>
        <div class="shio-boot-progress" aria-hidden="true"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
