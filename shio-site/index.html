    <meta name="description" content="An open-source, self-hosted headless CMS with four ways in: a full React console needing no agent at all, an MCP and CLI surface for coding agents, content projected to files for a repository workflow, and REST plus GraphQL delivery with TypeScript SDKs." />
    <meta name="theme-color" content="#FF6347" />
    <meta property="og:title" content="Viglet Shio: a complete CMS your agent can drive too" />
    <meta property="og:description" content="A complete CMS, agent-ready and not agent-only. Console, agent, files or API: four ways in, one content engine. Open source and self-hosted." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://shio.viglet.org/" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://shio.viglet.org/og.png" />
    <!-- anti-FOUC: apply the stored theme class before first paint (the prerendered HTML paints before the bundle) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("shio-site-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              globalThis.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked: fall back to the default (light) theme */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

      gtag("config", "G-SMSL7R3897");
