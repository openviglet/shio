<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Viglet Shio: the open-source, agent-ready CMS</title>
    <meta name="description" content="An open-source, self-hosted, agent-ready CMS with four ways in: a full React console needing no agent at all, an MCP and CLI surface for coding agents, content projected to files for a repository workflow, and REST plus GraphQL delivery with TypeScript SDKs." />
    <meta name="theme-color" content="#7c3aed" />
    <meta property="og:title" content="Viglet Shio: the open-source, agent-ready CMS" />
    <meta property="og:description" content="A complete CMS, agent-ready and not agent-only. Console, agent, files or API: four ways in, one content engine. Open source and self-hosted." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://openviglet.github.io/shio/" />
    <meta property="og:image" content="https://openviglet.github.io/shio/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="canonical" href="https://openviglet.github.io/shio/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://openviglet.github.io/shio/og.png" />
    <!-- anti-FOUC: apply the stored theme class before first paint (the prerendered HTML paints before the bundle) -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("shio-site-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              globalThis.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          /* storage blocked: fall back to the default (light) theme */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
