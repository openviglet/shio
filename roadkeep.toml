# Shio's roadkeep configuration — written by roadkeep RK20, the first real corpus.
#
# The two defects that kept this out of CI are fixed. RK44 taught the reader an outline
# rationale file (151 headings that yielded 0 sections now yield 83) and RK43 a ledger whose
# lines carry no status marker (920 lines that yielded 0 entries now parse), so the 403
# findings of the first run — about 174 of them false — are down to a handful, all real.
#
# roadkeep is not vendored here and there is no path to a checkout: it arrives as a Claude
# Code plugin (`/plugin marketplace add alegauss/roadkeep`, then `/plugin install
# roadkeep@alegauss`), which supplies the hook, the MCP tools and the skill; CI runs the
# published action. This file is the only roadkeep artefact the repository carries.
#
# Every value here is what docs/ROADMAP.md already spells, so adopting the tool changes the
# format of nothing that is already correct.

prefix = "SH"

# Shio numbers its rationale by a hand-kept outline (§XVI.47), not by task id. Migrating a
# live outline is a separate decision from adopting the tool, so the scheme follows the
# file rather than the file following the scheme.
ref_scheme = "outline"

# What the roadmap used to say in prose, and no longer does: the agent-native blocks come
# before the pre-existing backlog (Block F's SH44–SH47 tenant work), Block P is the current
# focus, and after it the suggested order is H → K → I → J → O → L → M. A queue stated as a
# heading ("Part 1 — current focus") is one `pick` cannot read and one nobody updates; stated
# here it is what `pick` and `brief` answer with, and every token is validated.
#
# An id may be listed ahead of the blocks, and Block Q's replication run was: fifteen tasks in
# execution order rather than id order, because a smoke test against a real site found defects
# whose fix order was not their filing order. They have all shipped and the entries are spent,
# so they are gone — a consumed queue left in place is one `pick` keeps answering with. What is
# worth keeping is the three rules that produced the order, since the retest filed four more
# (SH438–SH441) and the next run will want them: the safety fix and the end-to-end test first,
# because one makes every later dry run trustworthy and the other locks the handoffs the rest
# of the queue changes; then the pipeline repaired upstream to downstream, capture before
# conversion before theme, because each phase reads what the one before it wrote; then the
# write path last, since an applier is only worth building once the proposal is worth applying.
priority = [
  "Block P",
  "Block H",
  "Block K",
  "Block I",
  "Block J",
  "Block O",
  "Block L",
  "Block M",
  "Block N",
]

[files]
roadmap = "docs/ROADMAP.md"
changelog = "docs/CHANGELOG.md"
improvements = "docs/IMPROVEMENTS.md"
# no strategy: Shio has none — absent, not empty

[limits]
# symptom is left at the default because the corpus already meets it: 0 of 78 lines exceed
# 120 characters, p90 is 86. The field the authors kept short is the one whose scope is
# bounded by what it is — "what does not work" is one clause.
symptom = 120

# why is left at the default *although* 70 of 78 lines exceed it, which is the opposite
# reasoning and the whole finding of RK20: those 70 are not rationale with nowhere to go.
# 67 of them point at a section in IMPROVEMENTS.md that already exists and already makes
# the same argument, so the limit is not asking anybody to delete a design — it is asking
# for the sentence that the paragraph at the pointer is the long form of.
why = 200
line = 320

section = 250
prose = 88

[limits.changelog]
# The ledger's own numbers (RK50). Its 233 entries predate the tool and read 1038
# characters at the median, 4122 at the worst: holding history to the 320 a roadmap line is
# refused at produces 600 findings about work nobody will redo. The gate that matters is
# still the write path - `ship` copies a why already refused at 200, so every entry this
# tool writes is short by construction, and only a hand-written `record` could use the room.
why = 4200
line = 4300

[rules.changelog]
# The two prose rules this file's history cannot obey (RK52). `why is one sentence` says the
# remainder belongs in the section the line points at, and a shipped line has none: 233 of
# these entries are paragraphs written before the tool existed, and no edit short of deleting
# them satisfies the rule. The roadmap keeps both rules, which is where they bite.
one_sentence = false
terminator = false

[markers]
open = ["📋", "💭", "⏳", "🛠"]
shipped = "✅"
retired = "🗑"

# Declared at all means governed (SH265). The roadmap already carried eight non-goals as free
# prose and `non-goal add` refused to write the ninth, so the list the project calls *binding* was
# the one part of the file no schema and no lint reached — which is the argument for the table
# rather than a reason to hand-edit around it. The two limits are left at their defaults: the
# eight that exist already fit.
#
# This key needs a roadkeep newer than the plugin that was installed here on 2026-07-30 (0847dc0):
# an older reader refuses the *config* before it reads a line of the backlog, so every command,
# the MCP tools and the CI gate all exit non-zero and say nothing about the corpus. If that is
# what you are looking at, update the plugin — the key is not the defect.
[non_goals]

[ledger]
# The two slots Shio's ledger lines do not have: no marker, because the file itself is the
# statement that the work shipped (RK43), and no bold symptom, because every entry is
# `- **SH134** - <prose>` (RK48). Declared here, so those 234 entries parse and the 96 deps
# that point at them resolve instead of reading as "in neither file".
marker = false
symptom = false
