# Shio's roadkeep configuration — written by roadkeep RK20, the first real corpus.
#
# The two defects that kept this out of CI are fixed. RK44 taught the reader an outline
# rationale file (151 headings that yielded 0 sections now yield 83) and RK43 a ledger whose
# lines carry no status marker (920 lines that yielded 0 entries now parse), so the 403
# findings of the first run — about 174 of them false — are down to a handful, all real.
#
# roadkeep is not vendored here and there is no path to a checkout: it arrives as a Claude
# Code plugin (`/plugin marketplace add alegauss/roadkeep`, then `/plugin install
# roadkeep@alegauss`), which supplies the hook, the MCP tools and the skill; CI runs the
# published action. This file is the only roadkeep artefact the repository carries.
#
# Every value here is what docs/ROADMAP.md already spells, so adopting the tool changes the
# format of nothing that is already correct.

prefix = "SH"

# Ids this project spoke for and deliberately never wrote as a line (SH649, closing a gap
# roadkeep itself filed as RK1031). Two families, and neither is a wording problem:
#
#   **Epics that own a sub-range.** SH62 (Media Library), SH67, SH74 (the agent-native CMS,
#   whose spec is docs/specs/SH74-agent-native-cms.md) and SH19 (the AngularJS → React console
#   migration, decomposed into SH56-SH61 and others). The number exists so a reader can name
#   the whole in one token; the work ships under the sub-ids. SH19 is the clearest case — the
#   ledger's own entry says "tracked as SH19 in ROADMAP" and every slice of it landed as
#   something else.
#
#   **Ranges retired with their block.** SH17/SH18 are the dropped GraalJS server-side template
#   engine (the former Block D), and SH23 with SH27-SH31 the absorbed marketplace epic. Both are
#   cited in the non-goals, which is where a decision NOT to build something has to keep its id
#   or the argument loses its address.
#
# Declared rather than reworded, because the alternative the lint suggests — spell the example
# outside the prefix — would make the non-goals stop naming what they refuse. What the
# declaration buys is the thing the lint was right about: `next-id` skips them because they ARE
# taken, the gate stops calling every mention a hazard, and a genuine typo still fails, because
# it is not on this list.
reserved_ids = [
  "SH17", "SH18", "SH19", "SH23", "SH27", "SH31", "SH62", "SH67", "SH74",
]

# Shio numbers its rationale by a hand-kept outline (§XVI.47), not by task id. Migrating a
# live outline is a separate decision from adopting the tool, so the scheme follows the
# file rather than the file following the scheme.
ref_scheme = "outline"

# What the roadmap used to say in prose, and no longer does: the agent-native blocks come
# before the pre-existing backlog (Block F's SH44–SH47 tenant work), Block P is the current
# focus, and after it the suggested order is H → K → I → J → O → L → M. A queue stated as a
# heading ("Part 1 — current focus") is one `pick` cannot read and one nobody updates; stated
# here it is what `pick` and `brief` answer with, and every token is validated.
#
# An id may be listed ahead of the blocks, and a replication run is: tasks in execution order
# rather than id order, because a smoke test against a real site finds defects whose fix order
# is not their filing order. A spent entry is deleted — a consumed queue left in place is one
# `pick` keeps answering with.
#
# **The second run is spent.** Eight tasks, run on instruction as
# SH448 → SH449 → SH437 → SH452 → SH451 → SH450 → SH447 → SH446, which is not the order this
# file proposed and is worth recording as a correction rather than a deviation. Two of its
# claims were wrong. SH437 did *not* need SH451: it needed a site-and-path resolution, not that
# one, so the asset route hangs off the preview and the public `/sites/**` grammar stayed whole
# for SH451. And putting the conformance suite last would have been the worse call — run first
# it was red on SH446 by construction (the SH338 order: the instrument precedes the fixes) and
# it found SH453 and SH454 on its first execution, seven tasks before the queue would have. It
# also caught the live-boundary defect in every task after it, which is the argument the suite
# exists to make. It is green as of SH446.
# The third run is done: SH458, SH455, SH456, SH457, SH453 and SH454 all shipped, and the
# instrument-first argument held again — SH458's three assertions landed red by construction and
# each went green as its fix arrived. Two of the six turned a conformance workaround into an
# assertion (SH453's two site.upsert ops became one, SH454's three teardown calls became one),
# which is the shape to look for next.
#
# The fourth run kept the instrument first for a different reason than the third, and SH460 has
# shipped: it is not a test that finds defects but what makes a red run legible, and validating
# the third run cost a detour that nearly filed two defects which did not exist — the instance had
# been running since before the commits it was being asked about, and only the JVM's start time
# against the class timestamps said so. The manifest now dates its own build and the conformance
# harness refuses an instance older than HEAD, before any scenario runs. Then the last two steps
# between an uploaded asset and a served one, cheapest first — both shipped. SH461: one page carried
# two rewriting rules for one job and the stylesheet used the broken one, so the theme now emits the
# source's path and the render pass walks <style> the way it already walked src. SH462: the assets
# were never in DRAFT (upload writes PUBLISHED), but no write could NAME them, and making the op
# reachable found that unpublish would have deleted them outright. SH459 closed the run: the locale
# segment is checked against the site's own content rather than pinned, and a URI no controller
# claims answers 404 instead of 401. The fourth run is spent — four tasks, four commits, and the
# instrument-first argument held once more (SH460 shipped before the three it made legible).
# Block R is first on instruction (2026-08-06): the published documentation at docs-shio
# describes the 2018 product — MCP, agent, Universal Editor, Handlebars, blueprint and tenant
# appear in zero of its 19 pages while Nashorn and shObject appear in six — so every block
# below has shipped into a documentation set that contradicts it. The matrix (SH479) is first
# within the block for the SH338 reason: it lands red and its count scopes the rest.
# The fifth replication run, ordered by what the next test can even see. SH520 led and has
# shipped: it was the only one that lost content — accepting one block dropped the rest of the
# page, so every authorable measurement taken before it described a page that was mostly gone,
# including the 106 annotated fields this round reported as a success. SH516 followed for the
# same reason one level up and has shipped: the gate said `ok` on that page, so until it read
# what it approved, a green run was not evidence and each round was hand-measured with a
# resolver I got wrong twice. Then
# the two that broke a replica on sight (SH512's relative refs, SH515's uncollected ones,
# both shipped), then
# the capture's own honesty (SH505's overlay text becoming content and SH506's
# script-as-block and SH517's baked canvas, all shipped), and last the two that only
# cost time (SH513 and SH514). The fifth run is spent: nine tasks, nine commits, and the
# order held - SH520 and SH516 first made every measurement after them worth reading.
# MIGRATED (2026-08-12, on instruction): the queue now lives in docs/ROADMAP.md, where every
# roadkeep verb reaches it — `priority migrate` moved it so that Block Q could be put first, which
# is the act this file made unavailable (the note at the foot of this block predicted exactly that
# and chose to wait). The declaration below is commented out rather than deleted, and so is the
# history above and inside it: `lint` reports a live `priority = [...]` here as `priority.config`
# because the section wins and the config's order would be read by nothing, but eight runs of
# ordering rationale are the reason those orders were what they were, and that is not dead.
# priority = [
  # The sixth run, on instruction (2026-08-06): SH521 through SH529, dependency-ordered rather
  # than by id. SH521 led for SH516's reason one level along and has shipped - every check
  # resolved against the tree, so `ok` on a page that had lost most of itself was a fact the
