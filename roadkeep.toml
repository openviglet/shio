  # CLI still writes `{{CSS}}`, which is why the corpus holds a red case under a closed id.
  #
  # The tenth run, on instruction (2026-08-07). The ninth left the judge trustworthy, and the
  # first round judged by it says the conversion is where the work now is. `diff` on a fresh
