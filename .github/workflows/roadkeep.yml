# The gate the write path already runs locally, called through the action roadkeep
# publishes rather than a copied `run:` block. `roadkeep lint` exits 1 on a governed file
# that drifted, and that exit code is the whole contract.
#
# SH1102 — bare, and on every push. It ran by hand only, against `baseline: origin/main`,
# because the lint was never clean: six `code.renamed` findings came from the rule resolving
# Shio's prose against the vendored engine's own modules (RK1707), and one of them sat on an
# entry no verb could correct (RK1708). Both are fixed in roadkeep 0.2.511, the lint exits 0
# here with no baseline, and a gate that only runs when somebody remembers is how it drifted.
name: roadkeep

on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  lint:
    name: roadkeep lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: alegauss/roadkeep@main
