# SH579 — the two suites that were red at HEAD, run where nobody has to choose to look.
#
# Measured at `6bc4ba8`: `pnpm conformance` failed one of five and `pnpm -C cli test` failed one of
# 1148. Eleven commits landed over the first and eight over the second, and no commit message
# mentions either. Every other workflow in this directory is `workflow_dispatch`, so a red run was
# only ever visible to somebody who had already decided to run it locally — which is the same thing
# as not being visible.
#
# One of those two alarms turned out to be wrong (a reader blind to `shio-site/scripts`), and that
# is the argument for this file rather than against it: a false alarm nobody answers is how a
# suite's colour stops meaning anything, and the next true one is then also unread.
#
# The rule these jobs enforce is in docs/agents/build.md — a red suite either blocks the next
# commit or is a dated entry in red-suites.json. This workflow does not know about that ledger and
# should not: an exception is a licence to keep *committing*, never a licence to make CI green.
name: Suites

on:
  push:
    branches: ["2026.3", "main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: suites-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The whole JS workspace: cli, client, model, sections, create-shio-app, the plugin, the console
  # and the public site. No instance, no browser, no registry — that is what `pnpm test` is for, and
  # why it is the job that runs on every pull request in a couple of minutes.
  js:
    name: pnpm test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history: SH841 resolves HEAD~1 and SH861 reads when each block's last ship landed,
      # and a depth-1 clone has neither — both failed here, and only here, on every run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      - name: Build what the suites import
        # shio-sections' tests import .ts directly, but shio-react and the examples resolve the
        # built SDK. Cheaper than discovering that as a test failure with no line of ours in it.
        run: pnpm run build:sdk && pnpm run build:sections

      # SH1126 — the console, so the size gate has bytes from THIS tree to measure.
      #
      # SH1043's comparison runs against whatever build sits in the static root, and `pnpm test` never
      # built one — so the gate measured a build of *some* tree with nothing saying which, and it went
      # wrong in both directions on consecutive tasks: one passed against bytes older than its own
      # change, the next failed the headroom check only because a build made outside the session
      # happened to include it. `build-info.json` lets the test tell, and this is the run that gives it
      # something to tell about. ~10s against a job budget of 20 minutes, which is what makes it
      # affordable to have the number on every pull request rather than whenever somebody built.
      - name: Build the console, so the size gate measures this tree
        run: pnpm run build:console

      # SH1126 — and having built it, this run refuses to be told nothing. Locally a stale build is a
      # diagnostic (a source edit must not demand a build before `pnpm test`); here "not measured"
      # means the build step and the suite disagree about the tree, which is a failure.
      - run: pnpm test
        env:
          SHIO_REQUIRE_CONSOLE_BUILD: "1"

      # SH665 — the console's own lint, which had not run since ESLint 10. Its config extended a
      # preset whose `plugins` key ESLint 10 rejects, so `eslint` exited 2 on every file including
      # untouched ones, and nothing in CI ran it to say so. It gates here rather than in `pnpm test`
      # because it is a different question — the suites ask whether the code works, this asks
      # whether it is the shape React needs — and because a red lint must not hide a red suite.
      #
      # The 33 findings that existed when it was repaired are in `shio-react/eslint-suppressions.json`,
      # so this is green today and red on anything NEW. `--prune-suppressions` removes an entry once
      # its finding is fixed, which is what makes the list only shrink.
      - name: The console lint (new findings only — the rest are in the suppressions file)
        run: pnpm lint

  # SH655 — the published documentation, checked on every push, because two of its three
  # instruments need no instance at all.
  #
  # `docs-vocabulary` (SH499) and `docs-stack` (SH628) read the pages, this repository's source and
  # its build files; only `docs-examples` drives the booted app, and it stays in the conformance job
  # below. Splitting them by that cost is the decision this job is: the pair answers "do the
  # published pages still name this product's verbs and its real stack" in the time `pnpm test`
  # takes, and there is no reason for that question to wait behind a JVM.
  #
  # **Their input is another repository**, which is why they had never run in CI: `SHIO_DOCS_DIR`
  # defaults to one contributor's drive letter, so on a runner the directory was simply absent —
  # and absent is a hard failure by design (SH499 chose to fail rather than skip, so an unread
  # checkout could not pass quietly). The price of that choice is that the workflow has to supply
  # the checkout, and nothing did.
  #
  # No token: `vigletdocs.github.io` is public, and the default `GITHUB_TOKEN` is scoped to this
  # repository. Pinned to nothing — the docs are the *current* published pages, and testing this
  # commit against a frozen copy of them would assert a pair that agreed once.
  docs:
    name: pnpm conformance:docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Check out the published documentation
        uses: actions/checkout@v7
        with:
          repository: vigletdocs/vigletdocs.github.io
          path: vigletdocs

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      # The docs suites import the CLI's own modules, which resolve through the workspace; the SDK
      # build is what `shio-client` consumers need and is cheap enough to keep this job one step.
      - name: Build what the suites import
        run: pnpm run build:sdk

      - run: pnpm conformance:docs
        env:
          SHIO_DOCS_DIR: ${{ github.workspace }}/vigletdocs/docs-shio

  # SH241 — the third gate, and the one only CI can give honestly.
  #
  # `clean test` is the command agents.md names, and the reason it must run here as well as
  # locally is SH282: without `clean`, a call to a method that no longer exists prints "Nothing to
  # compile" and BUILD SUCCESS, because the IDE compiled into `target/classes` on save and the
  # `.class` outlived the `.java`. `ShIdeCompiledClassLintTest` protects the person about to
  # commit; it cannot protect the branch, because a *stale but valid* class is indistinguishable
  # from a compiled one. A job that starts from a clone has no stale anything.
  #
  # On push and pull request both: it is the cheapest of the three gates that needs a JVM, and the
  # one whose failures are most often somebody else's file.
  java:
    name: mvnw clean test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "zulu"
          cache: maven

      # SH1076 — a pin CI cannot resolve fails here, naming the version and the fix, rather than as a
      # POM Maven cannot read with no count and no failing name (which is how it went a month unseen).
      - name: The pinned viglet-core is on Maven Central
        run: node scripts/check-published-deps.mjs

      # `-Dskip.npm=true` because the console build is the `js` job's question, and paying for it
      # here would make this the slowest job for a reason unrelated to what it asserts.
      # `tee` rather than a pipe: SH354 — a filter that reads the total discards the `<<< FAILURE!`
      # lines in the same breath, and then a red run leaves no record of which test failed.
      - name: Run the suite
        id: suite
        run: |
          set -o pipefail
          ./mvnw -B -pl shio-app -am clean test -Dskip.npm=true 2>&1 | tee "$RUNNER_TEMP/java.log"

      # SH283 — surefire's own `Results:` total is the authoritative one, and the reason to publish
      # it here is that every alternative is a hand-derived number: `target/surefire-reports/`
      # ACCUMULATES, so summing it after a targeted run inflates the next total, and `-q` suppresses
      # the only line that is not a guess. `always()` because the count matters most when it is red.
      - name: Publish the count as the run's headline
        if: always()
        run: |
          {
            echo "### Java suite"
            echo
            grep -E "Tests run:.*Failures.*Errors" "$RUNNER_TEMP/java.log" | tail -1 || echo "no surefire summary — the build failed before the tests ran"
            echo
            if grep -qE "<<< (FAILURE|ERROR)" "$RUNNER_TEMP/java.log"; then
              echo "<details><summary>Failing tests</summary>"
              echo
              echo '```'
              grep -E "<<< (FAILURE|ERROR)" "$RUNNER_TEMP/java.log"
              echo '```'
              echo
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The whole log, because the summary above is a headline and a diagnosis needs the run.
      - name: Keep the run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: java-suite-log
          path: ${{ runner.temp }}/java.log
          if-no-files-found: warn

  # The opt-in suite, and the reason it is a separate job: it needs a running instance built from
  # the commit under test. `requireInstance` compares the manifest's commit against `git log -1`
  # before any scenario builds anything (SH460/SH500), so a job that boots a jar it did not build
  # from this checkout would fail on staleness rather than on the code — which is exactly the
  # behaviour that gate exists for, and exactly why this job builds first.
  conformance:
    name: pnpm conformance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SHIO_USER: admin
      SHIO_PASSWORD: shio-conformance
    steps:
      - uses: actions/checkout@v7

      # SH655 — `docs-examples` is the third docs instrument and the only one that needs the booted
      # app, so it belongs to this job rather than to `docs` above. Without this checkout it read a
      # path that does not exist on a runner and failed by design, which is how the whole docs half
      # of `pnpm conformance` had never run anywhere but one machine.
      - name: Check out the published documentation
        uses: actions/checkout@v7
        with:
          repository: vigletdocs/vigletdocs.github.io
          path: vigletdocs

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: "zulu"
          cache: maven

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install the workspace
        run: pnpm install --frozen-lockfile

      # The suite's harness imports @viglet/shio-client, which resolves to `dist/` — a fresh clone
      # has none, and the failure that produces names no file of this suite.
      - name: Build what the suite imports
        run: pnpm run build:sdk

      # -DskipTests: the Java suite is not this job's question and paying for it twice would make
      # this the job people disable. `package` writes git.properties, which is where the manifest's
      # `commit` comes from.
      - name: Build the app
        run: ./mvnw -B -DskipTests package

      # SH1259 — ready means the credentials work, not that the port answers. ShOnStartup is an
      # ApplicationRunner, so the app serves requests before it has seeded `admin`; a POST to
      # /api/v2/setup in that window answered 403 (no admin row reads as "setup done"), the
      # password was never set, and every conformance call was a 401. The password now comes from
      # SHIO_ADMIN_PASSWORD (SH706's bootstrap), and the wait is an authenticated read.
      - name: Boot the app
        run: |
          SHIO_ADMIN_PASSWORD="$SHIO_PASSWORD" nohup java -jar shio-app/target/viglet-shio.jar > "$RUNNER_TEMP/shio.log" 2>&1 &
          for i in $(seq 1 120); do
            if curl -sf -o /dev/null -u "$SHIO_USER:$SHIO_PASSWORD" "http://localhost:2710/api/v2/agent/manifest"; then
              echo "up and authenticating after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the app did not come up with a working admin login"; tail -100 "$RUNNER_TEMP/shio.log"; exit 1

      - run: pnpm conformance
        env:
          SHIO_DOCS_DIR: ${{ github.workspace }}/vigletdocs/docs-shio

      # The suite seeds `ShioConf…` sites and removes them in `after`; what is worth keeping is the
      # server's side of a failure, because half of this suite's findings are 500s with no body.
      - name: App log
        if: failure()
        run: tail -300 "$RUNNER_TEMP/shio.log"
