# SH182 — the console smoke check, in CI.
#
# The console is the one surface no API test can see: a form that renders zero fields, a
# button that navigates nowhere, a request that 404s behind a spinner all answer 200. That is
# a gap in *medium*, not in discipline, and the only instrument that closes it is a browser.
# `shio-react/e2e/console-check.mjs` found six failing routes of fifteen on its first run;
# without this workflow they regress silently.
#
# The job boots the real jar (which serves the built console at /console, so no dev server is
# involved), provisions a site from the SH94 `marketing-site` blueprint — the package every
# Block O defect was reproduced against — and walks the routes. The report and the
# screenshots are uploaded whether it passes or fails, because "which page was blank" is the
# question a failure raises.
name: Console check

# SH241 — on pull request rather than on every push, and that split is the deliberate half of the
# task. This job boots a jar, provisions a site and drives Chromium: it is the most expensive gate
# here, and running it on every push to a branch somebody is iterating on is how a job becomes the
# one people cancel. A pull request is the moment the question "does the console still work" is
# actually being asked.
#
# It stayed `workflow_dispatch`-only while the other two moved, which is the same failure in
# miniature: a gate that does not run is a script, and this one exists because the console is the
# surface no API test can see.
on:
  pull_request:
  workflow_dispatch:

jobs:
  console-check:
    name: Walk the console in a browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SHIO_USER: admin
      SHIO_PASSWORD: shio-console-check
      SHIO_SITE: Console Check
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: 'zulu'
          cache: maven

      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install JS workspace
        run: pnpm install --frozen-lockfile

      # Builds the console into shio-app/src/main/resources/public and packages the jar, so
      # the app under test serves exactly the assets a release would.
      - name: Build the app
        run: ./mvnw -B -DskipTests package

      - name: Install Chromium for Playwright
        run: pnpm -C shio-react exec playwright install --with-deps chromium

      # SH1259 — boot with the password and wait for it to authenticate; see suites.yml. The
      # setup POST in provision.mjs then answers "already set", which it treats as success.
      - name: Boot the app
        run: |
          SHIO_ADMIN_PASSWORD="$SHIO_PASSWORD" nohup java -jar shio-app/target/viglet-shio.jar > "$RUNNER_TEMP/shio.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null -u "$SHIO_USER:$SHIO_PASSWORD" "http://localhost:2710/api/v2/agent/manifest"; then
              echo "up and authenticating after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "the app did not come up with a working admin login"; tail -100 "$RUNNER_TEMP/shio.log"; exit 1

      # A clean instance has no admin password and no site; neither is a console defect.
      - name: Provision a site to walk
        run: node shio-react/e2e/provision.mjs --api http://localhost:2710 --site "$SHIO_SITE"

      - name: Console check
        run: >-
          pnpm -C shio-react run console:check --
          --base http://localhost:2710
          --api http://localhost:2710
          --site "$SHIO_SITE"
          --strict

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-check-report
          path: shio-react/e2e/report
          if-no-files-found: warn

      - name: App log
        if: failure()
        run: tail -200 "$RUNNER_TEMP/shio.log"
