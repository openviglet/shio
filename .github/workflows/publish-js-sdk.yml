name: Publish JS packages (npm)

# Publishes the Shio JavaScript packages to npm, in dependency order:
#   1. @viglet/shio-model       (the post-types DSL; no dependencies)
#   2. @viglet/shio-sections    (the page-section vocabulary; depends on the DSL)
#   3. @viglet/shio-client      (framework-agnostic core)
#   4. @viglet/shio-react-sdk   (depends on the core via workspace:*)
#   5. @viglet/shio-editor-cors (Universal Editor bridge; standalone)
#   6. @viglet/create-shio-app  (Next.js starter generator)
#   7. @viglet/shio             (CLI; depends on the core + the generator)
#
# The first two joined in SH156, and their absence was a real defect rather than a
# decision: both are packaged to be published (`dist`, `files`, `prepublishOnly`) and
# neither was reachable from a generated project — so a blueprint that carried a page
# importing `@viglet/shio-sections` would have produced a project whose `npm install`
# fails. The vocabulary is meant to be *one shared language for the agent, the console
# and the front end* (SH95), and a language nobody can install is not shared.
#
# `shio-editor-cors` is the same defect, one release later and with a sharper edge:
# SH304 **deleted** the copy the server used to serve at `/universal-editor/` on the
# grounds that external editing has a published home — this package — so its absence
# from the registry left no way at all to get the bridge into a front end that writes
# its own `data-sh-*`. `renderer.md` calls that "one bridge per producer": the injected
# script for the markup the renderer emits, this package for everyone else. Both
# example sites already depend on it via `workspace:*`, which resolves nowhere outside
# this monorepo (SH446's failure mode).
#
# pnpm workspace: `pnpm publish` automatically rewrites the `workspace:*`
# dependency to the published version — which is why the order above is load-bearing:
# shio-sections depends on shio-model that way. The console (shio-react) is private and
# is never published.
#
# Every package is under the @viglet scope, including the generator: an unscoped
# name has no org to belong to, so npm files it under the account that owns
# NPM_TOKEN — which is how `create-shio-app` ended up listed as a personal package
# while its five siblings sat in the org. `npm create @viglet/shio-app` is the
# scoped invocation of the same shorthand.
#
# Requires repo secret: NPM_TOKEN (npm automation token with publish rights to
# the @viglet scope).

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Version bump"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.8.0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: "pnpm"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      # ── One version for the whole workspace, every run ──
      #
      # The root is the register: it is bumped once, and the resulting string is
      # then *stamped* into every workspace package. The previous form ran
      # `npm version <type>` inside each package through a hand-written list of
      # `--filter`s, which has two defects this shape does not:
      #
      #   1. **It increments, it does not converge.** Each package bumps from its
      #      own current value, so the versions stay equal only for as long as they
      #      already are. Any drift is permanent — and a run that fails *after* some
      #      packages have published creates exactly that drift, because the commit
      #      step never runs and the repo keeps versions npm has already taken.
      #   2. **The list had to be maintained by hand**, which is how
      #      `@viglet/shio-editor-cors` sat outside the release for two versions.
      #      `-r --include-workspace-root` cannot miss a package that exists.
      #
      # Private packages (the console, the examples, the Claude plugin) are stamped
      # too. They are never published, but "one version for the workspace" is only
      # checkable if it means all of it — `shio-react` had already drifted to 2026.3
      # against everything else's 2026.3.1, and nothing said so.
      #
      # `--allow-same-version` is what makes the stamp idempotent: the root is
      # already at the target by the time the recursive pass reaches it.
      - name: Bump versions
        id: version
        run: |
          npm version "${{ inputs.release-type }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"
          pnpm -r --include-workspace-root exec -- \
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          # SH1245: the MCP Registry entry names the npm version it installs, so it is
          # stamped with the rest; cli/test/mcp-registry.test.mjs fails on a mismatch.
          node -e "
            const fs = require('fs');
            const s = JSON.parse(fs.readFileSync('cli/server.json', 'utf8'));
            s.version = '$VERSION';
            for (const p of s.packages) p.version = '$VERSION';
            fs.writeFileSync('cli/server.json', JSON.stringify(s, null, 2) + '\n');
          "

      # ── The invariant, asserted before anything is published ──
      #
      # The step above cannot leave the workspace uneven, so this is not a check on
      # it — it is a check on everything *else* that can: a package added at another
      # version, a hand-run `npm version`, a half-published previous run. It reads
      # the workspace from pnpm rather than from a list, for the same reason the bump
      # does, and it fails here rather than after three packages are already on npm.
      - name: Assert one version across the workspace
        run: |
          pnpm ls -r --depth -1 --json | node -e "
            let raw = '';
            process.stdin.on('data', (d) => (raw += d)).on('end', () => {
              const want = require('./package.json').version;
              const off = JSON.parse(raw).filter((p) => p.version !== want);
              if (!off.length) return console.log('all packages at ' + want);
              for (const p of off) console.error(p.name + ' is at ' + p.version + ', not ' + want);
              process.exit(1);
            });
          "

      # ── Re-emit the carried front-end files, because the bump changes them ──
      #
      # `emit` composes the blueprint packages from `create-shio-app/template/`,
      # `shio-sections/front-end/` and — since SH216 — `create-shio-app/overlays/`. It said
      # "three" until that task took it to six, which is the kind of number a comment should
      # not carry: `PACKAGES` in emit.mjs is the list, and `emit.test.mjs` asserts it.
      # The range it writes for a *needed*
      # package is `rangeFor(name) ?? ^<workspace version>` (emit.mjs). While
      # `@viglet/shio-sections` is unpublished `rangeFor` answers `null`, so the
      # fallback applies and the emitted range **is** the workspace version — which
      # the bump just changed. Without this step the committed tree is stale the
      # moment the release commits, and `emit.test.mjs` turns the next run of the
      # suite red on a drift nobody introduced by editing anything.
      #
      # It runs after the assert so it composes from a workspace that is already on
      # one version, and before the build so a failure here costs no publish.
      - name: Re-emit the blueprint packages
        run: pnpm -C create-shio-app run emit

      # ── And read what it produced, because the next step COMMITS it (SH218) ──
      #
      # The drift test cannot cover this. It runs on a push and answers "the tree matches its
      # source"; the release runs `emit` and then commits whatever came out, so nobody checks
      # that the output was the output anybody expected. A job that regenerates content into
      # `shio-app/src/main/resources/` and commits it unread can land anything.
      #
      # The rule is about files rather than lines: a release changes VERSIONS, and a generated
      # file appearing or disappearing during one is either an overlay somebody edited without
      # running `emit` or a generator that broke. A release commit is the worst place for either,
      # because it is the one nobody reviews.
      #
      # Runs before the build, so a surprise costs no publish.
      - name: Check the re-emit changed only what a release changes
        run: pnpm -C create-shio-app run emit:check

      # ── What the release deliberately does NOT touch: the scaffold's ranges ──
      #
      # This step used to rewrite `create-shio-app/template/package.json` to
      # `^<the version just bumped>`, and that is the precise defect SH446 exists to
      # make impossible: a scaffold is consumed *outside* this repository, so the only
      # version it may name is one the **registry** can serve, and the workspace's
      # version is that only in the instant after a release. Every bump re-broke every
      # scaffold, and nothing said so until a human ran `npm install`.
      #
      # `create-shio-app/src/published.mjs` is now the one table, and
      # `scaffold-versions.test.mjs` asserts the template matches it *and* that the
      # range is deliberately not the workspace's — so the rewrite would have turned
      # the next release into a red suite as well as a broken scaffold.
      #
      # The table is therefore updated by hand after a release succeeds, which is the
      # step where `@viglet/shio-model` and `@viglet/shio-sections` stop being `null`.
      # Automating it here would still need that test's hard-coded expectations moved
      # in the same commit; doing it as a task keeps the two in one diff.

      # ── Build: the DSL and the vocabulary, then the client and the SDK on it ──
      # The bridge is built here rather than left to its own `prepublishOnly`, so a
      # broken build fails before anything has been published rather than halfway through.
      - name: Build packages
        run: pnpm run build:sections && pnpm run build:sdk && pnpm run build:editor

      # ── Publish in dependency order (pnpm resolves workspace:* → version) ──
      - name: Publish @viglet/shio-model
        run: pnpm --filter @viglet/shio-model publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After the DSL: its `workspace:*` dependency resolves to the version just published,
      # so publishing these two out of order would ship a package pointing at a version
      # that does not exist yet.
      - name: Publish @viglet/shio-sections
        run: pnpm --filter @viglet/shio-sections publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/shio-client
        run: pnpm --filter @viglet/shio-client publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/shio-react-sdk
        run: pnpm --filter @viglet/shio-react-sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Standalone: no workspace dependency in either direction, so its position is
      # only about failing early — before the two packages a consumer installs by name.
      - name: Publish @viglet/shio-editor-cors
        run: pnpm --filter @viglet/shio-editor-cors publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/create-shio-app
        run: pnpm --filter @viglet/create-shio-app publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/shio (CLI)
        run: pnpm --filter @viglet/shio publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit the version bumps ──
      - name: Commit version bump
        run: |
          # A pathspec, not a list — the bump is workspace-wide, so enumerating the
          # packages here would reintroduce exactly the hand-maintained list the bump
          # step just got rid of, and leave a newly added package's bump uncommitted.
          # node_modules is gitignored, so it cannot be swept in.
          git add ':(glob)**/package.json' package.json cli/server.json \
                  shio-app/src/main/resources/blueprints
          git commit -m "chore: release JS packages v${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push
