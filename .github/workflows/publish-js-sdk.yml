name: Publish JS packages (npm)

# Publishes the Shio JavaScript packages to npm, in dependency order:
#   1. @viglet/shio-client      (framework-agnostic core)
#   2. @viglet/shio-react-sdk   (depends on the core via workspace:*)
#   3. create-shio-app          (Next.js starter generator)
#   4. @viglet/shio             (CLI; depends on the core + create-shio-app)
#
# pnpm workspace: `pnpm publish` automatically rewrites the `workspace:*`
# dependency to the published version. The console (shio-react) is private and
# is never published.
#
# Requires repo secret: NPM_TOKEN (npm automation token with publish rights to
# the @viglet scope and create-shio-app).

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Version bump"
        type: choice
        default: patch
        options: [patch, minor, major]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.13.1

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          scope: "@viglet"
          cache: "pnpm"

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile=false

      # ── Bump the three publishable packages (same type), keep the template
      #    dependency range in sync so generated apps pull the new core ──
      - name: Bump versions
        id: version
        run: |
          pnpm --filter @viglet/shio-client \
               --filter @viglet/shio-react-sdk \
               --filter create-shio-app \
               --filter @viglet/shio \
               exec -- npm version "${{ inputs.release-type }}" --no-git-tag-version
          VERSION=$(node -p "require('./shio-client/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing version $VERSION"
          node -e "
            const fs = require('fs');
            const p = 'create-shio-app/template/package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.dependencies['@viglet/shio-client'] = '^$VERSION';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          "

      # ── Build (client first, then the SDK that depends on it) ──
      - name: Build packages
        run: pnpm run build:sdk

      # ── Publish in dependency order (pnpm resolves workspace:* → version) ──
      - name: Publish @viglet/shio-client
        run: pnpm --filter @viglet/shio-client publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/shio-react-sdk
        run: pnpm --filter @viglet/shio-react-sdk publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish create-shio-app
        run: pnpm --filter create-shio-app publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @viglet/shio (CLI)
        run: pnpm --filter @viglet/shio publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ── Commit the version bumps ──
      - name: Commit version bump
        run: |
          git add shio-client/package.json shio-react-sdk/package.json \
                  create-shio-app/package.json create-shio-app/template/package.json \
                  cli/package.json
          git commit -m "chore: release JS packages v${{ steps.version.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push
