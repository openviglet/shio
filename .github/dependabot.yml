# Dependabot configuration for the Shio monorepo.
# Frontend uses a pnpm workspace at the repo root (pnpm-workspace.yaml) — Dependabot
# discovers every workspace member (shio-react, shio-client, shio-model,
# shio-react-sdk, create-shio-app, cli) from the root manifest + pnpm-lock.yaml,
# so a single `npm` block covers them all. Grouping bundles each ecosystem's
# updates into one PR instead of one-per-dependency-per-project.
#
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "org.webjars.bower:*"
      - dependency-name: "org.webjars.npm:*"
      - dependency-name: "org.webjars:*"
    groups:
      java:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.2"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
