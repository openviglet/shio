# Dependabot configuration for the Shio monorepo.
# Frontend uses a single pnpm workspace at the repo root (pnpm-workspace.yaml) —
# Dependabot discovers EVERY workspace member (shio-react, shio-client, shio-model,
# shio-react-sdk, shio-js-sdk/@viglet/shio-editor-cors, create-shio-app, cli and the
# shio-examples/* sites) from the root manifest + the single pnpm-lock.yaml, so one
# `npm` block covers them all. Folding the examples + editor bridge into the workspace
# (and dropping their stray package-lock.json files) is what collapsed the former
# per-project npm PRs into this one grouped PR. Grouping bundles each ecosystem's
# updates into one PR instead of one-per-dependency-per-project.
#
# https://help.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "org.webjars.bower:*"
      - dependency-name: "org.webjars.npm:*"
      - dependency-name: "org.webjars:*"
    groups:
      java:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 15
    ignore:
      - dependency-name: "typescript"
    groups:
      frontend:
        applies-to: version-updates
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    open-pull-requests-limit: 5
    # Track only the JDK/JRE base image; keep it on Java 21 LTS. Java 25 breaks
    # embedded Artemis 2.43.0 (Netty CleanerJava25 "Cannot clean arbitrary
    # ByteBuffer instances"). Allow 21.x patch/minor bumps, never a major to 25+.
    allow:
      - dependency-name: "eclipse-temurin"
    ignore:
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "2026.3"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
