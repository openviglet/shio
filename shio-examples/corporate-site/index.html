<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viglet Corporate</title>

  <!-- Shio Universal Editor: Connection metadata -->
  <meta name="urn:shio:system:connection" content="shio:http://localhost:2710">
  <meta name="urn:shio:system:site" content="viglet_corporate">
  <meta name="urn:shio:system:path" content="Home">
  <!-- SH350 - which origin may drive the editor. The bridge is inert without it, because a
       framed page cannot work out who framed it. This is the console's origin: the packaged
       console is served by Shio itself, a console running from the Vite dev server is
       http://localhost:5173. -->
  <meta name="urn:shio:system:editor-origin" content="http://localhost:2710">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>

  <!-- Shio Universal Editor Bridge (@viglet/shio-editor-cors) -->
  <script type="module" src="/src/editor.ts"></script>
</body>
</html>
